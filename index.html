  document.getElementById("v-mod").innerHTML = `${accuracy()}${seasonCard()}${paperBets()}${disagreements()}${tests}`;
}

// La stagione passata giocata dal modello completo: barre in scala con i punti
function seasonCard() {
  const c = D.test && D.test.stagione_completa;
  if (!c) return "";
  const mx = Math.max(...c.righe.map(r => r.punti)), best = Math.max(...c.righe.slice(0, -1).map(r => r.punti));
  const rows = c.righe.map((r, k) => `<div class="sc-row${k === c.righe.length - 1 ? " ghost" : r.punti === best ? " best" : ""}">
    <div class="sc-h"><span>${esc(r.strategia)}</span><b>${r.punti.toLocaleString("it-IT")}</b></div>
    <div class="sc-bar"><i style="--w:${(r.punti / mx * 100).toFixed(1)}%;--b:${k}"></i></div>
    <small class="muted">${num(r.punti / r.giornate, 0)} a giornata · ${r.cambi} cambi · valore rosa ${num(r.valore)}</small></div>`).join("");
  return `<div class="card">${head(`La stagione ${esc(c.stagione)} giocata dal modello`)}<div class="sc">${rows}</div><p class="note">${esc(c.note)}</p></div>`;
}

// Cambi di rosa consigliati per la giornata (la formazione la decidi tu turno per turno)
function diffCard(g) {
  if (!D.app || !D.app.attuale) return "";
  const mine = new Set(D.app.attuale.map(p => p.nome));
  const inn = g.giocatori.filter(p => !mine.has(p.nome)).map(p => p.nome);
  if (!inn.length) return "";
  const outP = D.app.attuale.filter(p => !g.giocatori.some(q => q.nome === p.nome));
  const inP = g.giocatori.filter(p => !mine.has(p.nome));
  const sum = a => a.reduce((s, p) => s + (p.crediti || 0), 0);
  const li = (p, k) => `<li style="--k:${k}"><span>${esc(p.nome)}</span><small>${cr(p.crediti)}</small></li>`;
  return `<div class="card">${head(`Cambi di rosa per la ${esc(g.label)}`, g.malus ? `malus −${num(g.malus, 0)}` : "")}
    <div class="swap-h"><span class="lab">Escono</span><span></span><span class="lab">Entrano</span></div>
    <div class="swap"><ul class="o">${outP.map(li).join("")}</ul>${ARROW}<ul class="i">${inP.map(li).join("")}</ul></div>
    <div class="swap-sum"><span>Escono <b>${cr(sum(outP))}</b> cr</span><span>Entrano <b>${cr(sum(inP))}</b> cr</span></div>
    <p class="note">${g.malus ? `Malus −${num(g.malus, 0)}. ` : ""}La formazione la scegli tu turno per turno: prima di ogni turno ti dico chi cambiare in base ai punti già fatti.</p></div>`;
}

function priceRows(names) {
  const snaps = D.fotografie;
  return names.map(n => {
    const pr = D.giocatori[n]?.prezzi || {};
    const vals = snaps.map(s => pr[s]);
    const first = vals.find(v => v != null), last = [...vals].reverse().find(v => v != null);
    return {n, vals, d: first != null && last != null ? last - first : null};
  });
}

    : `<p class="muted">Partirà da sola dopo la prima giornata con le variazioni reali: oggi le plusvalenze attese sono una stima.</p>`;
  document.getElementById("v-prezzi").innerHTML = `
    <div class="kpis"><div class="kpi hi"><b>${num(tot.at(-1))}</b><span>valore rosa</span></div>
      <div class="kpi"><b>${snaps.length > 1 ? sign(tot.at(-1) - tot[0]) : "–"}</b><span>dalla ${esc(snaps[0] || "G1")}</span></div>
      <div class="kpi"><b>${snaps.length}</b><span>fotografie</span></div><div class="kpi"><b>${esc(snaps.at(-1) || "–")}</b><span>ultima</span></div></div>
    <div class="card">${head("Valore della rosa", "crediti")}${chart}</div>
    <div class="card">${head("Prezzi della rosa", `${rows.length} giocatori`)}<div class="scroll"><table><thead><tr><th>Giocatore</th>${snaps.map(s => `<th>${esc(s)}</th>`).join("")}<th>Var.</th></tr></thead>
      <tbody>${rows.sort((a, b) => (b.d ?? 0) - (a.d ?? 0) || (b.vals.at(-1) ?? 0) - (a.vals.at(-1) ?? 0)).map(r => `<tr><td>${esc(r.n)}</td>${r.vals.map(v => `<td>${v == null ? "–" : cr(v)}</td>`).join("")}
      <td class="${r.d > 0 ? "up" : r.d < 0 ? "down" : ""}">${r.d == null || snaps.length < 2 ? "–" : sign(r.d)}</td></tr>`).join("")}</tbody></table></div></div>

// Regola dei prezzi tarata sulle variazioni reali: variazione = a + b·punti + c·crediti (per singola giornata).
// Dunkest muove i prezzi a passi di 0,1 e il minimo è 4 crediti.
const rule = () => (D.taratura && D.taratura.b > 0) ? D.taratura : null;
const round1 = v => Math.round(v * 10) / 10;
function plusFor(cr, pts) { const t = rule(); if (!t) return null; const raw = t.a + t.b * pts + t.c * cr; return Math.max(round1(raw), round1(4 - cr)); }
function ptsFor(cr, plus) { const t = rule(); return t ? (plus - 0.05 - t.a - t.c * cr) / t.b : null; }   // punti minimi per arrivare a "plus"
const TARGETS = [-0.3, -0.1, 0, 0.1, 0.3, 0.5, 1.0];

function thresholdsTable(cr) {
  return `<table class="thr-table"><thead><tr><th>Per ottenere</th><th>Servono almeno</th></tr></thead><tbody>${
    TARGETS.map(tg => `<tr><td class="${tg > 0 ? "up" : tg < 0 ? "down" : ""}">${tg > 0 ? "+" : ""}${num(tg)} cr</td><td>${num(Math.max(0, ptsFor(cr, tg)))} punti</td></tr>`).join("")
  }</tbody></table>`;
}

let calcCr = 10, calcPts = 25;
try { const s = JSON.parse(localStorage.getItem("pcc-calc") || "{}"); if (s.cr) calcCr = s.cr; if (s.pts != null) calcPts = s.pts; } catch (e) {}
function renderCalc() {
  const el = document.getElementById("v-calc");
  if (!rule()) { el.innerHTML = `<div class="empty"><b>Regola dei prezzi non ancora disponibile</b><span>Esegui <code>python dunkest_cli.py storico</code> e ripubblica la pagina.</span></div>`; return; }
  const t = rule();
  el.innerHTML = `
    <div class="card">${head("Calcolatore plusvalenza")}
      <p class="note">Quanto cambia il prezzo di un giocatore dopo una giornata, dati i crediti e i punti Dunkest fatti.</p>
      <div class="calc">
        <label for="c-cr"><span>Crediti <b id="c-cr-v"></b></span><input type="range" id="c-cr" min="4" max="30" step="0.1" value="${calcCr}"></label>
        <div class="scale-l" aria-hidden="true"><span>4</span><span>30</span></div>
        <label for="c-pts"><span>Punti Dunkest nella giornata</span><input type="number" id="c-pts" inputmode="decimal" step="0.5" value="${calcPts}"></label>
        <div class="result" aria-live="polite"><div><b id="c-plus"></b><span>variazione attesa</span></div><div><b id="c-new"></b><span>nuovo valore</span></div></div>
      </div></div>
    <div class="card">${head("Andamento")}
      <p class="note">Quanti punti servono, a questo prezzo, per ogni plusvalenza o minusvalenza.</p>
      <div id="c-thr"></div></div>
    <div class="card">${head("Da dove viene")}
      <p class="note">Il calcolatore ufficiale non esiste più. Questa regola è ricavata da ${t.campioni.toLocaleString("it-IT")} variazioni reali delle stagioni ${Object.keys(t.stagioni || {}).sort().join(", ")}: sui prezzi veri del 2025-26 indovina la variazione esatta nel 91% dei casi e sbaglia di più di 0,1 crediti solo nell'1%. Varianti con la media del giocatore o curve non lineari non fanno meglio. Vale per i giocatori; per gli allenatori non ci sono dati.</p></div>`;
  const upd = () => {
    calcCr = +document.getElementById("c-cr").value; calcPts = parseFloat(String(document.getElementById("c-pts").value).replace(",", ".")) || 0;
    try { localStorage.setItem("pcc-calc", JSON.stringify({cr: calcCr, pts: calcPts})); } catch (e) {}
    const pl = plusFor(calcCr, calcPts);
    document.getElementById("c-cr-v").textContent = num(calcCr);
    const pe = document.getElementById("c-plus"); pe.textContent = sign(pl); pe.className = pl > 0 ? "up" : pl < 0 ? "down" : "";
    document.getElementById("c-new").textContent = num(calcCr + pl);
    document.getElementById("c-thr").innerHTML = thresholdsTable(calcCr);
  };
  el.querySelectorAll("input").forEach(i => i.addEventListener("input", upd));
  upd();
}

// Ultime partite: barre dei punti Dunkest, linea dei punti attesi per la giornata
function spark(G, expv) {
  if (!G || !G.length) return "";
  const W = 320, H = 124, top = 18, base = 98, n = G.length, bw = (W - 8) / n;
  const mx = Math.max(...G.map(x => x.punti), expv || 0, 10), Y = v => base - Math.max(0, v) / mx * (base - top);
  const avg = G.reduce((s, x) => s + x.punti, 0) / n;
  const bars = G.map((x, k) => { const h = base - Y(x.punti), X = 4 + k * bw;
    return `<rect class="b" style="--b:${k}" x="${(X + bw * .18).toFixed(1)}" y="${Y(x.punti).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="3" fill="${expv && x.punti >= expv ? "var(--accent)" : "color-mix(in srgb,var(--muted) 45%,transparent)"}"><title>${dmy(x.data)} ${x.casa ? "vs" : "@"} ${esc(x.avv)}: ${num(x.punti)} punti in ${x.min} min</title></rect>`; }).join("");
  const labels = G.map((x, k) => { const X = 4 + k * bw + bw / 2;
    return `<text class="v" style="--b:${k}" x="${X.toFixed(1)}" y="${(Y(x.punti) - 4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)" stroke="var(--surface)" stroke-width="3" paint-order="stroke">${Math.round(x.punti)}</text>
      <text x="${X.toFixed(1)}" y="${base + 15}" text-anchor="middle" font-size="9" fill="var(--muted)">${x.casa ? "" : "@"}${esc(x.avv)}</text>`; }).join("");
  const line = expv ? `<line x1="2" x2="${W - 2}" y1="${Y(expv).toFixed(1)}" y2="${Y(expv).toFixed(1)}" stroke="var(--fg)" stroke-opacity=".75" stroke-dasharray="4 3" stroke-width="1.2"/>` : "";
  return `<div class="spark"><div class="spark-h"><b>Ultime ${n} partite</b><span class="muted num" style="font-size:var(--fs-s)">media ${num(avg)}</span></div>
    ${expv ? `<p class="legend"><span><i class="hi"></i>sopra gli attesi</span><span><i class="dash"></i>attesi ${num(expv)}</span></p>` : ""}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Punti Dunkest nelle ultime ${n} partite, media ${num(avg)}">
    <line x1="2" x2="${W - 2}" y1="${base}" y2="${base}" stroke="var(--line-2)"/>${bars}${line}${labels}</svg>
    <span class="note" style="font-size:.8rem">${D.partite_stagione ? `${esc(D.partite_stagione)} (${dmy(G[0].data)}/${G[0].data.slice(2, 4)} – ${dmy(G.at(-1).data)}/${G.at(-1).data.slice(2, 4)}). ` : ""}In arancio le partite sopra i punti attesi; @ = in trasferta.</span></div>`;
}

    <header>${jersey(p.squadra, info.maglia, p.ruolo === "HC")}<div><h3 id="sh-name">${esc(p.nome)}</h3><div class="sub">${esc(p.squadra)} · ${ROLE_LONG[p.ruolo] || ROLE[p.ruolo]} · ${esc(p.slot)}</div></div>
    <button type="button" class="close" aria-label="Chiudi"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg></button></header>
    <div class="facts main"><div><b>${num(p.punti)}</b><span>punti attesi</span></div><div><b>${p.plus_cr != null ? sign(p.plus_cr, 2) : sign(p.plus)}</b><span>${p.plus_cr != null ? "crediti attesi" : p.ruolo === "HC" ? "plus stimata (pt)" : "plus attesa (pt)"}</span></div><div><b>${cr(p.crediti)}</b><span>crediti</span></div></div>
    <dl class="dl">${dl.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${info.notizia && info.notizia.stato !== "NOTE" ? `<div class="news"><b>${esc(info.notizia.titolo)}</b>${esc(info.notizia.testo)} <span class="muted">· ${info.notizia.ore != null ? (info.notizia.ore < 24 ? Math.round(info.notizia.ore) + " h fa" : Math.round(info.notizia.ore / 24) + " g fa") : ""} · basketballmonster</span></div>` : ""}
    ${p.p_dd != null ? `<div class="facts"><div><b>${Math.round(p.p_dd * 100)}%</b><span>doppia doppia</span></div>
      <div><b>${p.p_td < 0.01 ? "<1" : Math.round(p.p_td * 100)}%</b><span>tripla doppia</span></div>
      <div><b>${Math.round((p.p_3t || 0) * 100)}%</b><span>3+ triple</span></div></div>` : ""}
    ${spark(info.partite, p.punti)}
    ${formBlock(info.forma)}
    ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
    ${sourcesBlock(info.fonti)}
    ${p.ruolo !== "HC" && rule() ? `<details><summary><span>Punti che servono a ${cr(p.crediti)} crediti</span></summary>${thresholdsTable(p.crediti)}</details>` : ""}
    <div><div class="lab" style="margin-bottom:6px">Prezzi</div><div class="prices">${prices}</div></div>`;
  [...el.children].forEach((c, i) => c.style.setProperty("--i", Math.min(i, 8)));
  clearTimeout(sheetTimer);
  const scrim = document.getElementById("scrim");
  scrim.hidden = false; el.hidden = false; el.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add("open"); scrim.classList.add("on"); }));
  el.querySelector(".close").focus({preventScroll: true});
}

let sheetTimer = 0;
function closeSheet() {
  const el = document.getElementById("sheet"), scrim = document.getElementById("scrim");
  if (el.hidden) return;
  el.classList.remove("open"); scrim.classList.remove("on"); scrim.style.opacity = "";
  sheetTimer = setTimeout(() => { el.hidden = true; scrim.hidden = true; }, calm ? 0 : 400);
  const back = document.querySelector(`.pc[data-id="${el.dataset.from}"]`); if (back) back.focus({preventScroll: true});
}

// ——— movimento ———
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let keepDays = false;

let dir = 0;            // -1 / +1: da che parte entra il contenuto (vista o giornata precedente/successiva)
const lastVals = {};   // ultimo valore mostrato da ogni numero del tabellone: si conta da lì, non da zero
const reveal = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("play"); reveal.unobserve(e.target); }
}), {rootMargin: "0px 0px 60px 0px"}) : null;

function animateIn(el) {
  const kids = [...el.children];
  kids.forEach(c => { c.classList.remove("play"); reveal && reveal.unobserve(c); });
  el.style.setProperty("--dx", dir); el.style.setProperty("--dy", dir ? "0px" : "12px");
  el.querySelectorAll(".pc").forEach((c, j) => c.style.setProperty("--j", j));
  void el.offsetWidth;   // riparte l'animazione anche sugli stessi elementi
  let i = 0;
  kids.forEach(c => {
    if (!reveal || c.getBoundingClientRect().top < innerHeight) { c.style.setProperty("--i", Math.min(i++, 10)); c.classList.add("play"); }
    else { c.style.setProperty("--i", 0); reveal.observe(c); }   // fuori schermo: parte quando ci arrivi scorrendo
  });
  countKpis(el);
  if (!calm) el.querySelectorAll(".result b").forEach(b => countUp(b, 0));
  dir = 0;
}

// I numeri del tabellone contano dal valore di prima e, se è cambiato, mostrano per un attimo di quanto
function countKpis(el) {
  el.querySelectorAll(".kpi").forEach(k => {
    const b = k.querySelector("b"), key = view + "|" + (k.querySelector("span")?.textContent || "");
    if (!b) return;
    const prev = lastVals[key], cur = parse(b.textContent)?.v;
    if (!calm) countUp(b, prev ?? 0);
    if (prev != null && cur != null && Math.abs(cur - prev) >= 0.05) {
      const dlt = document.createElement("i"), dv = cur - prev, dec = (parse(b.textContent)?.dec) || 0;
      dlt.className = "delta " + (dv > 0 ? "pos" : "neg"); dlt.setAttribute("aria-hidden", "true");
      dlt.textContent = (dv > 0 ? "+" : "−") + Math.abs(dv).toLocaleString("it-IT", {minimumFractionDigits: dec, maximumFractionDigits: dec});
      k.appendChild(dlt); if (calm) dlt.classList.add("static"); else requestAnimationFrame(() => dlt.classList.add("show"));
    }
    lastVals[key] = cur;
  });
}

// I numeri delle schede contano fino al valore (stesso formato e stessi decimali del testo finale)
function parse(txt) {
  const m = txt.match(/^([+−-]?)(\d{1,3}(?:\.\d{3})*|\d+)(?:,(\d+))?(.*)$/);
  if (!m) return null;
  const dec = m[3] ? m[3].length : 0, a = parseFloat(m[2].replace(/\./g, "") + (dec ? "." + m[3] : ""));
  return {v: m[1] && m[1] !== "+" ? -a : a, dec, plus: m[1] === "+", rest: m[4]};
}
function countUp(b, from = 0) {
  const txt = b.textContent, m = parse(txt);
  if (!m || m.v === from || !isFinite(from)) return;
  const t0 = performance.now(), dur = 600 + Math.min(400, Math.abs(m.v - from) * 2);
  const fmt = v => (v < 0 ? "−" : m.plus && v > 0 ? "+" : "") + Math.abs(v).toLocaleString("it-IT", {minimumFractionDigits: m.dec, maximumFractionDigits: m.dec}) + m.rest;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    b.textContent = k < 1 ? fmt(from + (m.v - from) * e) : txt;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Indicatore che scivola sotto la vista scelta
function moveIndicator() {
  const nav = document.querySelector(".seg"), on = nav.querySelector('button[aria-pressed="true"]'), ind = nav.querySelector(".seg-ind");
  if (!on) return;
  ind.style.width = on.offsetWidth + "px"; ind.style.height = on.offsetHeight + "px";
  ind.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
  if (!nav.classList.contains("js")) { nav.classList.add("js"); requestAnimationFrame(() => requestAnimationFrame(() => nav.classList.add("ready"))); }
}
addEventListener("resize", moveIndicator);

// Conto alla rovescia alla prossima giornata che non è ancora iniziata
function clock() {
  const el = document.getElementById("clock");
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const g = D.piano.giornate.find(x => new Date(x.dal + "T12:00:00") >= today);
  if (!g) { el.hidden = true; return; }
  const n = Math.round((new Date(g.dal + "T12:00:00") - today) / 864e5);
  const ball = `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--accent)"/><g fill="none" stroke="var(--strip)" stroke-width="1"><path d="M1 8h14M8 1v14"/><path d="M3 3c2.5 2.5 2.5 7.5 0 10M13 3c-2.5 2.5-2.5 7.5 0 10"/></g></svg>`;
  el.innerHTML = `${ball}${esc(g.label)} ${n === 0 ? "<b>oggi</b>" : n === 1 ? "<b>domani</b>" : `tra <b>${n}</b> giorni`}`;
  el.hidden = false;
}

function render() {
  if (!D) return;
  day = Math.min(Math.max(day, 0), D.piano.giornate.length - 1);
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
  VIEWS.forEach(v => document.getElementById("v-" + v).hidden = v !== view);
  const strip = document.querySelector("#v-form .days"), scroll = strip ? strip.scrollLeft : 0;
  ({form: renderForm, occ: renderOcc, prezzi: renderPrezzi, inf: renderInf, calc: renderCalc, mod: renderMod})[view]();
  if (keepDays) { const s = document.querySelector("#v-form .days"); if (s) s.scrollLeft = scroll; }
  keepDays = false;
  if (!litOnce && view === "form" && !calm) { const c = document.querySelector("#v-form .court"); if (c) { c.classList.add("lights"); litOnce = true; } }
  if (vtActive) countOnly(document.getElementById("v-" + view));   // durante la transizione i giocatori si spostano da soli
  else animateIn(document.getElementById("v-" + view));
  const mm = document.querySelector(".mode");   // la pillola scivola dalla rosa di prima a quella scelta
  if (mm) requestAnimationFrame(() => requestAnimationFrame(() => { mm.dataset.m = mode; }));
  prevMode = null;
  moveIndicator();
}

document.addEventListener("click", e => {
  const v = e.target.closest(".seg button"); if (v) { if (v.dataset.view === view) { scrollTo({top: 0, behavior: calm ? "auto" : "smooth"}); return; } dir = Math.sign(VIEWS.indexOf(v.dataset.view) - VIEWS.indexOf(view)); view = v.dataset.view; save(); render(); if (scrollY > 200) scrollTo({top: 0}); return; }
  const mb = e.target.closest("[data-mode]"); if (mb) { if (mb.dataset.mode === mode) return; morph(() => { prevMode = mode; mode = mb.dataset.mode; dir = mode === "mia" ? 1 : -1; keepDays = true; save(); render(); }); return; }
  const d = e.target.closest("[data-day]"); if (d) { if (+d.dataset.day === day) return; goDay(+d.dataset.day); return; }
  const c = e.target.closest(".pc"); if (c) { if (swiped) return; document.getElementById("sheet").dataset.from = c.dataset.id; openSheet(+c.dataset.id); return; }
  if (e.target.closest(".close") || e.target.id === "scrim") closeSheet();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && e.target.closest && e.target.closest(".days")) { e.preventDefault(); goDay(day + (e.key === "ArrowRight" ? 1 : -1)); requestAnimationFrame(() => document.querySelector(`.days [data-day="${day}"]`)?.focus()); }
});

// Cambio di giornata o di rosa: chi resta scivola al nuovo posto, chi esce sparisce, chi entra compare (View Transitions)
let vtActive = false, litOnce = false;

// Carte in 3D al passaggio del mouse (solo con mouse: sul telefono restano ferme)
if (!calm && matchMedia("(hover: hover) and (pointer: fine)").matches) {
  document.addEventListener("pointermove", e => {
    const c = e.target.closest && e.target.closest(".pc");
    document.querySelectorAll(".pc.tilt").forEach(x => { if (x !== c) { x.classList.remove("tilt"); x.style.transform = ""; } });
    if (!c) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    c.classList.add("tilt");
    c.style.transform = `perspective(520px) rotateX(${(-y * 12).toFixed(1)}deg) rotateY(${(x * 14).toFixed(1)}deg) translateY(-4px)`;
  }, {passive: true});
}
function morph(fn) {
  if (calm || view !== "form" || !document.startViewTransition) { fn(); return; }
  vtActive = true;
  const t = document.startViewTransition(() => { fn(); });
  t.finished.finally(() => { vtActive = false; });
}
function countOnly(el) {
  [...el.children].forEach(c => { c.classList.remove("play"); reveal && reveal.unobserve(c); });
  countKpis(el);
  dir = 0;
}

function goDay(n) {
  n = Math.min(Math.max(n, 0), D.piano.giornate.length - 1);
  if (n === day) return;
  morph(() => { dir = Math.sign(n - day); day = n; keepDays = true; save(); render(); });
  const b = document.querySelector(`.days [data-day="${n}"]`); if (b) b.scrollIntoView({block: "nearest", inline: "nearest", behavior: calm ? "auto" : "smooth"});
}

// Gesti: scorrere il campo cambia giornata (il campo segue il dito); trascinare giù la scheda giocatore la chiude
let touch = null, swiped = false;
document.addEventListener("touchstart", e => {
  const t = e.touches[0], sh = e.target.closest(".sheet");
  swiped = false;
  touch = {x: t.clientX, y: t.clientY, court: e.target.closest(".pitch"), sheet: sh && sh.scrollTop <= 0 ? sh : null, dy: 0, dx: 0, axis: null};
}, {passive: true});
document.addEventListener("touchmove", e => {
  if (!touch) return;
  const t = e.touches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (!touch.axis && Math.hypot(dx, dy) > 8) touch.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  if (touch.sheet && touch.axis === "y") {
    touch.dy = Math.max(0, dy);
    if (touch.dy > 0) {
      touch.sheet.classList.add("drag"); touch.sheet.style.transform = `translateY(${touch.dy}px)`;
      document.getElementById("scrim").style.opacity = String(Math.max(.2, 1 - touch.dy / 400));
    }
  } else if (touch.court && touch.axis === "x" && view === "form" && !calm) {
    const edge = (dx > 0 && day === 0) || (dx < 0 && day === D.piano.giornate.length - 1);
    touch.dx = dx;
    touch.court.classList.add("drag"); touch.court.style.transform = `translateX(${(dx * (edge ? .08 : .22)).toFixed(1)}px)`;
  }
}, {passive: true});
document.addEventListener("touchend", e => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (touch.court) { touch.court.classList.remove("drag"); touch.court.style.transform = ""; }
  if (touch.sheet) {
    touch.sheet.classList.remove("drag"); touch.sheet.style.transform = "";
    if (touch.dy > 90) closeSheet(); else document.getElementById("scrim").style.opacity = "";
  } else if (touch.court && view === "form" && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { swiped = true; goDay(day + (dx < 0 ? 1 : -1)); }
  touch = null;
});
addEventListener("scroll", () => document.querySelector(".seg").classList.toggle("stuck", scrollY > 90), {passive: true});

let offline = false;   // l'app installata dà l'ultima copia salvata dei dati quando manca la rete
fetch("data.json", {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(r.status); offline = r.headers.get("x-pcc-offline") === "1"; return r.json(); }).then(data => {
  D = data;
  document.getElementById("team").textContent = D.squadra;
  const [dd, tt] = D.aggiornato.split(" ");
  document.getElementById("upd").textContent = `${offline ? "Offline · dati salvati del" : "Aggiornato"} ${dmy(dd)} alle ${tt}`;
  clock();
  render();
}).catch(err => {
  document.getElementById("upd").textContent = "";
  document.getElementById("v-form").hidden = false;
  document.getElementById("v-form").innerHTML = `<div class="empty"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15"/><path d="M5 20h30M20 5v30"/></svg><b>Non riesco a leggere i dati del piano</b><span>Il file data.json non risponde (errore ${esc(err.message)}). Riprova; se il problema resta, chiedi a Claude di ripubblicare la pagina con <code>python dunkest_cli.py app</code>.</span><button type="button" class="btn" onclick="location.reload()" style="margin-top:6px">Riprova</button></div>`;
  moveIndicator();
});
moveIndicator();
</script>

<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
