// Stima di presenza decisa da te (solo su questo telefono): cambia i punti attesi di carte, schede, mercato e ricerca, non il piano
let OVR = {};
try { OVR = JSON.parse(localStorage.getItem("pcc-pres") || "{}") || {}; } catch (e) { OVR = {}; }
function saveOvr() { try { localStorage.setItem("pcc-pres", JSON.stringify(OVR)); } catch (e) {} }

// Punti attesi se il giocatore scende in campo (i "punti attesi" del piano sono già moltiplicati per la probabilità di giocare)
function condPts(p) {
  if (p._se != null) return p._se;
  const c = crow(p.id), d = c ? c.g[Math.min(day, c.g.length - 1)] : null;
  if (d && d.se != null) return d.se;
  return p.p_gioca != null && p.p_gioca >= 0.05 && p.punti ? p.punti / p.p_gioca : null;
}
function adj(p) {
  if (!p || p.ruolo === "HC" || p._adj || OVR[p.nome] == null) return p;
  const se = condPts(p);
  return se == null ? p : {...p, _adj: true, _se: se, _auto: p.p_gioca, p_gioca: OVR[p.nome], punti: se * OVR[p.nome]};
}
function seGioca(p) {
  if (p.ruolo === "HC" || p.p_gioca == null || p.p_gioca >= 0.95) return null;
  const v = condPts(p);
  return v && v > 0 ? v : null;
}
// Valori di una riga dell'indice di ricerca nella giornata mostrata, con la tua stima di presenza
function rowVals(c) {
  const d = srchDay(c), o = c.ruolo !== "HC" ? OVR[c.nome] : null;
  const se = d.se ?? (d.p >= 0.05 && d.punti ? d.punti / d.p : null);
  return o != null && se != null ? {...d, punti: se * o, p: o, adj: true, se} : {...d, adj: false, se};
}

// Statistiche attese a partita del giocatore p nella giornata mostrata (null se non ci sono)
function playerStats(p) {
  if (p.ruolo === "HC" || !p.partita) return null;
  const c = crow(p.id), d = c ? c.g[Math.min(day, c.g.length - 1)] : null;
  const st = p.stats || (d ? {pts: d.pts, reb: d.reb, ast: d.ast, stl: d.stl, blk: d.blk, min: d.min} : null);
  return st && st.pts != null ? {...st, src: d && d.src} : null;
}

function ovrBlock(p) {
  const cur = OVR[p.nome], opts = [0, 25, 50, 75, 90, 100];
  return `<div class="ovr"><div class="lab">La tua stima di presenza <span class="muted" style="text-transform:none;letter-spacing:0">· solo su questo telefono, non cambia il piano</span></div>
    <div class="ovr-c" role="group" aria-label="Probabilità di giocare">
      <button type="button" data-ovr="" aria-pressed="${cur == null}">Modello${p._auto != null ? " " + Math.round((p._adj ? p._auto : p.p_gioca) * 100) + "%" : ""}</button>
      ${opts.map(o => `<button type="button" data-ovr="${o}" aria-pressed="${cur != null && Math.round(cur * 100) === o}">${o}%</button>`).join("")}</div></div>`;
}

// Sostituti: stesso ruolo, fino a 1,5 crediti in più, i migliori per punti attesi nella giornata mostrata
function subsBlock(p) {
  if (!hasAll()) return shTab === "sub" ? needAll(refreshSheet, 4) : allLoading(4);   // si scaricano quando apri la scheda Sostituti
  const mine = new Set(D.rosa || []);
  const L = D.cerca.filter(c => c.id !== p.id && c.ruolo === p.ruolo && c.crediti <= p.crediti + 1.5)
    .map(c => ({c, v: rowVals(c)})).filter(x => x.v.partita && x.v.punti != null)
    .sort((a, b) => b.v.punti - a.v.punti).slice(0, 5);
  if (!L.length) return "";
  const base = p.punti || 0;

      <span class="m">${esc(c.squadra)} · ${cr(c.crediti)} cr (${sign(dc, 1)})${v.p != null && v.p < 0.95 ? ` · <i class="pd ${presCls(v.p)}" aria-hidden="true"></i>${Math.round(v.p * 100)}% presenza` : ""}${v.plus_cr != null ? " · plus " + sign(v.plus_cr, 2) + " cr" : ""}</span></button>`;

    <p class="note" style="margin:6px 0 0">Stesso ruolo, fino a 1,5 crediti in più di ${esc(surname(p.nome))}, i migliori per punti attesi (${esc(curG().label)}). Differenza rispetto ai suoi ${num(base)}.</p></div>`;
}

// Statistiche attese a partita: dalla simulazione, oppure (senza storico NBA) da FantasyPros o dalla preseason
function statsBlock(p) {

  const src = st.src ? `<p class="note" style="margin:6px 0 0">Stima da ${esc(st.src)}: senza storico NBA non c'è la simulazione completa.</p>` : "";

const inView = n => { const r = n.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight && r.width > 0; };

// Schede interne della scheda giocatore: la scelta resta per tutta la sessione

try { shTab = sessionStorage.getItem("pcc-shtab") || "pan"; } catch (e) {}
function pickShTab(k, focus) {
  const el = document.getElementById("sheet"), bar = el.querySelector(".sh-tabs"); if (!bar) return;
  const btns = [...bar.querySelectorAll("[data-shtab]")], i = btns.findIndex(b => b.dataset.shtab === k), was = btns.findIndex(b => b.dataset.shtab === shTab);
  if (i < 0) return;
  shTab = k; try { sessionStorage.setItem("pcc-shtab", k); } catch (e) {}
  if (k === "sub" && !hasAll()) { refreshSheet(); if (focus) el.querySelector('[data-shtab="sub"]')?.focus(); return; }   // avvia il caricamento dei sostituti
  bar.style.setProperty("--t", i);

  el.querySelectorAll(".sh-pan").forEach(p => {
    const on = p.id === "shp-" + k; p.hidden = !on;
    if (on && !calm) { p.classList.remove("tab-in"); p.style.setProperty("--dx", Math.sign(i - was)); p.style.setProperty("--dy", "0px"); void p.offsetWidth; p.classList.add("tab-in"); }
  });
  el.scrollTop = 0;
  if (focus) btns[i].focus();
}

// ——— giocatori di tutta la lega (cerca.json): indice di ricerca e schede di chi non è in rosa né nel piano ———
// data.json ha solo rosa e piano, così la pagina si apre presto. Il resto si scarica quando serve (ricerca, Mercato,

let sheetTimer = 0;
function closeSheet(fling) {
  const el = document.getElementById("sheet"), scrim = document.getElementById("scrim");
  if (el.hidden || !el.classList.contains("open")) return;
  el.dataset.closing = "1"; syncInert(false); layerClosed();
  const back = el.dataset.from ? document.querySelector(`#v-form:not([hidden]) .pc[data-id="${el.dataset.from}"]`) : null;
  const done = () => { if (!el.dataset.closing) return; el.hidden = true; scrim.hidden = true; el.style.transition = el.style.transform = ""; scrim.style.transition = ""; delete el.dataset.closing; };
  clearTimeout(sheetTimer);
  if (!fling && back && !calm && document.startViewTransition && inView(back)) {   // la scheda torna dentro la sua carta
    el.classList.add("vt"); document.documentElement.classList.add("vt-sheet");
    const t = document.startViewTransition(() => {
      el.classList.remove("open"); scrim.classList.remove("on"); scrim.style.opacity = ""; done();
      el.classList.remove("vt"); back.classList.add("vt-src");
    });
    t.finished.finally(() => { document.documentElement.classList.remove("vt-sheet"); back.classList.remove("vt-src"); });
    back.focus({preventScroll: true});
    return;
  }
  if (fling && !calm) {   // lanciata giù: continua con la velocità del dito
    const h = el.offsetHeight, now = new DOMMatrixReadOnly(getComputedStyle(el).transform).m42 || 0;
    const ms = Math.round(Math.min(240, Math.max(120, (h - now) / Math.max(fling, .8))));
    el.style.transition = `transform ${ms}ms cubic-bezier(.25,.6,.35,1)`; scrim.style.transition = `opacity ${ms}ms linear`;
    el.classList.remove("drag"); el.style.transform = ""; el.classList.remove("open"); scrim.classList.remove("on"); scrim.style.opacity = "";
    sheetTimer = setTimeout(done, ms + 20);
  } else {
    el.classList.remove("drag", "open"); el.style.transform = ""; scrim.classList.remove("on"); scrim.style.opacity = "";
    sheetTimer = setTimeout(done, calm ? 0 : 260);
  }
  if (back) back.focus({preventScroll: true});
}

// Valore al tocco nei grafici: un'etichetta sopra il segno; sparisce toccando altrove, scorrendo o dopo 3 secondi
(() => {
  const tip = document.getElementById("tip");
  let timer = 0, lit = null;
  const hide = () => { if (tip.hidden) return; tip.hidden = true; clearTimeout(timer); if (lit) { lit.classList.remove("on"); lit = null; } };
  document.addEventListener("click", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");

    const svg = t.ownerSVGElement, hl = t.dataset.hl;
    if (svg && hl != null) { lit = svg.querySelector(`[data-k="${hl}"]`); if (lit) lit.classList.add("on"); }
    const a = (lit || t.querySelector(".sb") || t).getBoundingClientRect();
    tip.textContent = t.dataset.tip; tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    // nei grafici l'etichetta sta sopra il disegno (non copre barre e numeri), centrata sul segno toccato
    const top = svg ? svg.getBoundingClientRect().top : a.top;
    const x = Math.min(innerWidth - w - 8, Math.max(8, a.left + a.width / 2 - w / 2)), y = top - h - 6 < 8 ? a.bottom + 8 : top - h - 6;
    tip.style.transform = ""; tip.style.left = x.toFixed(0) + "px"; tip.style.top = y.toFixed(0) + "px";
    timer = setTimeout(hide, 3000);
  });
  addEventListener("scroll", hide, {passive: true, capture: true});

  if (calm || view !== "form") { fn(); landCap(before, false); return; }
  if (!document.startViewTransition) { flipCards(fn); landCap(before, false); return; }
  vtActive = true; root.classList.add("vt-cap");
  const t = document.startViewTransition(() => { fn(); });
  t.finished.finally(() => { vtActive = false; root.classList.remove("vt-cap"); landCap(before, true); });
}
// Senza View Transitions (cambio di giornata, Piano/La mia rosa, Compatta/Completa): il campo non rifà l'entrata.
// Si muovono solo le carte che cambiano: chi resta ma cambia posto scivola dal posto di prima (FLIP, solo transform),
// chi entra compare dal basso; chi resta dov'era sta ferma (cambia solo il numero, che conta e lampeggia).
function flipCards(fn) {
  const sel = "#v-form .pc[data-id]", old = new Map();
  document.querySelectorAll(sel).forEach(c => { if (!old.has(c.dataset.id)) old.set(c.dataset.id, c.getBoundingClientRect()); });
  vtActive = true;
  try { fn(); } finally { vtActive = false; }
  if (calm || !old.size) return;
  let k = 0;
  document.querySelectorAll(sel).forEach(c => {
    const r = c.getBoundingClientRect(), o = old.get(c.dataset.id);
    if (r.bottom < 0 || r.top > innerHeight) return;   // fuori schermo: niente da vedere
    if (!o) { c.animate([{opacity: 0, transform: "translateY(16px) scale(.94)"}, {opacity: 1, transform: "none"}],
      {duration: 320, delay: 40 * Math.min(k++, 6), easing: "cubic-bezier(.34,1.45,.64,1)", fill: "backwards"}); return; }
    const dx = o.left - r.left, dy = o.top - r.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1)
      c.animate([{transform: `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`}, {transform: "none"}], {duration: 380, easing: "cubic-bezier(.22,1,.36,1)"});
  });
}
function countOnly(el) {
  blocks(el).forEach(c => { c.classList.remove("play"); reveal && reveal.unobserve(c); });
  countKpis(el);
  dir = 0;
}

function goDay(n) {
  n = Math.min(Math.max(n, 0), D.piano.giornate.length - 1);
  if (n === day) return;
  morph(() => { dir = Math.sign(n - day); day = n; keepDays = true; save(); render(); });
  // la striscia delle giornate scorre solo di lato fino alla giornata scelta: la pagina non salta su o giù
  const b = document.querySelector(`.days [data-day="${n}"]`), strip = b && b.parentElement;
  if (b && strip) { const l = b.offsetLeft - strip.offsetLeft, v = strip.scrollLeft; if (l < v + 8 || l + b.offsetWidth > v + strip.clientWidth - 8) strip.scrollTo({left: Math.max(0, l - 16), behavior: calm ? "auto" : "smooth"}); }
}

// Aggiorna tirando giù: il pallone scende col dito (con resistenza); oltre la soglia vibra e, lasciato, ricarica data.json
const PTR_AT = 72;
let ptrBusy = false;
const ptrEl = () => document.getElementById("ptr");
function ptrPull(t, dy) {
  const el = ptrEl(), pull = Math.min(120, dy * .5);
  t.pull = pull;
  el.classList.remove("back");
  el.style.transform = `translateY(${(Math.min(pull, 96) - 54).toFixed(1)}px)${calm ? "" : ` rotate(${(pull * 4).toFixed(0)}deg)`}`;
  el.style.opacity = Math.min(1, pull / 36).toFixed(2);
  const armed = pull >= PTR_AT;
  if (armed !== t.armed) { t.armed = armed; if (armed) buzz(10); }
}
function ptrBack() { const el = ptrEl(); el.classList.add("back"); el.classList.remove("busy"); el.style.transform = ""; el.style.opacity = ""; }
function refreshData() {
  if (ptrBusy) return;
  ptrBusy = true;
  const el = ptrEl(), st = document.getElementById("ptr-s"), t0 = performance.now();
  el.classList.add("back", "busy"); el.style.transform = "translateY(10px)"; el.style.opacity = "1";
  st.textContent = "Aggiorno i dati…";
  fetch("data.json", {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(r.status); offline = r.headers.get("x-pcc-offline") === "1"; return r.json(); })
    .then(data => { lastFail = null; applyData(data); vswap = true; keepDays = true; try { render(); } finally { vswap = false; } buzz(8); toast(`Dati aggiornati · ${document.getElementById("upd").textContent.replace(/^Aggiornato /, "")}`); })
    .catch(err => { const m = `Non riesco ad aggiornare (${err.message || "rete"}): restano i dati di prima.`;
      const n = new Date(); lastFail = {ora: `${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}`, motivo: navigator.onLine === false ? "sei offline" : err instanceof TypeError ? "rete non raggiungibile" : `errore ${err.message || "di rete"}`}; freshness(); document.getElementById("upd").textContent = m; toast("Aggiornamento non riuscito", "err"); st.textContent = m; })
    .finally(() => setTimeout(() => { ptrBusy = false; ptrBack(); }, Math.max(0, 450 - (performance.now() - t0))));
}

// Gesti: scorrere il campo cambia giornata (il campo segue il dito); in Squadra lo stesso gesto funziona anche fuori
// dal campo (non dentro tabelle, strisce che scorrono di lato, campi di testo, scheda, ricerca e dai bordi dello schermo,
// che sul telefono sono del sistema). Nel Mercato scorrere di lato il nome di una riga la mette o la toglie dai preferiti.
const NO_SWIPE = "#qres,.scroll,.days,.jump,.chips-x,.tabs,.mode,.dens,input,select,textarea,.mini,.sheet,.shv,.seg";
let touch = null, swiped = false;
document.addEventListener("pointerdown", () => { swiped = false; }, {passive: true, capture: true});   // anche col mouse o la penna
document.addEventListener("touchstart", e => {
  const t = e.touches[0], tg = e.target.closest ? e.target : document.body;
  swiped = false;
  const sheetOpen = !document.getElementById("sheet").hidden;
  const favCell = view === "occ" && occMode === "mkt" && !sheetOpen ? tg.closest(".mkt-t tbody td:first-child") : null;
  touch = {x: t.clientX, y: t.clientY, court: tg.closest(".pitch"), dx: 0, axis: null,
    page: !!D && view === "form" && !sheetOpen && !tg.closest(".pitch") && !tg.closest(NO_SWIPE) && t.clientX > 24 && t.clientX < innerWidth - 24,
    fav: favCell ? {cell: favCell, mn: favCell.querySelector(".mn"), name: favCell.querySelector("[data-fav]")?.dataset.fav, armed: false} : null,
    // tirare giù dalla cima della pagina ricarica i dati; non dentro scheda, ricerca, tabelle e strisce che scorrono di lato
    ptr: !!D && !ptrBusy && scrollY <= 0 && document.getElementById("sheet").hidden && !(e.target.closest && e.target.closest("#qres,.scroll,.days,.jump,.chips-x,input,select,textarea,.mini")),
    pull: 0, armed: false};
}, {passive: true});
document.addEventListener("touchmove", e => {
  if (!touch) return;
  const t = e.touches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (!touch.axis && Math.hypot(dx, dy) > 8) touch.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  if (touch.ptr && touch.axis === "y") {
    if (dy > 0 && scrollY <= 0) ptrPull(touch, dy); else if (touch.pull) { ptrBack(); touch.pull = 0; touch.armed = false; }
  }
  if (touch.court && touch.axis === "x" && view === "form" && !calm) {
    const edge = (dx > 0 && day === 0) || (dx < 0 && day === D.piano.giornate.length - 1);
    touch.dx = dx;
    touch.court.classList.add("drag"); touch.court.style.transform = `translateX(${(dx * (edge ? .08 : .22)).toFixed(1)}px)`;
  }
  if (touch.fav && touch.fav.mn && touch.axis === "x") {   // il nome segue il dito; oltre la soglia vibra (si può ancora tornare indietro)
    const f = touch.fav, arm = Math.abs(dx) > 56;
    if (!calm) f.mn.style.transform = `translateX(${Math.max(-72, Math.min(72, dx * .6)).toFixed(1)}px)`;
    if (arm !== f.armed) { f.armed = arm; if (arm) buzz(6); }
  }
}, {passive: true});
document.addEventListener("touchend", e => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (touch.court) { touch.court.classList.remove("drag"); touch.court.style.transform = ""; }
  if (touch.pull) { if (touch.armed) refreshData(); else ptrBack(); }
  if ((touch.court || touch.page) && view === "form" && touch.axis === "x" && Math.abs(dx) > (touch.court ? 60 : 72) && Math.abs(dx) > Math.abs(dy) * 1.5) {
    swiped = true; const was = day; goDay(day + (dx < 0 ? 1 : -1)); if (day !== was) buzz();
  }
  if (touch.fav && touch.fav.mn) {
    const f = touch.fav;
    if (touch.axis === "x" && Math.abs(dx) > 56 && f.name) { swiped = true; toggleFav(f.name); }
    if (f.mn.style.transform) {
      const from = f.mn.style.transform; f.mn.style.transform = "";
      if (!calm) f.mn.animate([{transform: from}, {transform: "none"}], {duration: 220, easing: "cubic-bezier(.34,1.45,.64,1)"});
    }
  }
  touch = null;
});
document.addEventListener("touchcancel", () => { if (touch && touch.fav && touch.fav.mn) touch.fav.mn.style.transform = ""; if (touch && touch.court) { touch.court.classList.remove("drag"); touch.court.style.transform = ""; } touch = null; }, {passive: true});

// Trascinare giù la scheda per chiuderla (pointer events, solo transform). Si prende dall'intestazione fissa
// (maniglia, nome, schede) oppure dal contenuto quando è già in cima. Lasciata sotto la soglia torna su con un
// piccolo rimbalzo; lanciata o tirata oltre un terzo si chiude continuando con la velocità del dito.
let sheetDrag = null, sheetDragMoved = false, sheetRaf = 0;
(() => {
  const el = document.getElementById("sheet"), scrim = document.getElementById("scrim");
  // la scheda insegue il dito nel frame di animazione con un filo di ritardo (inerzia); con "riduci movimento" lo segue e basta
  const paint = () => {
    sheetRaf = 0;
    const d = sheetDrag; if (!d) return;
    d.cy = calm ? d.y : d.cy + (d.y - d.cy) * 0.5;
    if (Math.abs(d.y - d.cy) < 0.4) d.cy = d.y;
    el.style.transform = `translateY(${d.cy.toFixed(1)}px)`;
    scrim.style.opacity = (1 - Math.min(1, Math.max(0, d.cy) / d.h)).toFixed(3);   // la scrim si schiarisce in proporzione
    if (d.cy !== d.y) sheetRaf = requestAnimationFrame(paint);
  };
  el.addEventListener("pointerdown", e => {
    if (!el.classList.contains("open") || e.button > 0 || el.classList.contains("vt")) return;
    const top = !!e.target.closest(".sh-top");
    if (!top && (el.scrollTop > 0 || e.target.closest("input,select,textarea,.scroll"))) return;
    sheetDrag = {id: e.pointerId, x0: e.clientX, y0: e.clientY, y: 0, cy: 0, on: false, top, h: el.offsetHeight, s: [[e.timeStamp, e.clientY]]};
    sheetDragMoved = false;
  });
  el.addEventListener("pointermove", e => {
    const d = sheetDrag; if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.on) {
      if (Math.hypot(dx, dy) < 6) return;
      if (Math.abs(dx) > Math.abs(dy) || (!d.top && (dy < 0 || el.scrollTop > 0))) { sheetDrag = null; return; }   // scorrimento normale
      d.on = true; d.y0 = e.clientY - Math.sign(dy) * 2;
      clearTimeout(sheetTimer); el.style.transition = scrim.style.transition = "";
      el.classList.add("drag"); scrim.classList.add("drag");
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    }
    const y = e.clientY - d.y0;
    d.y = y >= 0 ? y : -Math.pow(-y, .72);   // verso l'alto fa resistenza
    if (!sheetRaf) sheetRaf = requestAnimationFrame(paint);
    d.s.push([e.timeStamp, e.clientY]); if (d.s.length > 8) d.s.shift();
    sheetDragMoved = true;
  });
  const end = e => {
    const d = sheetDrag; if (!d || e.pointerId !== d.id) return;
    sheetDrag = null; cancelAnimationFrame(sheetRaf); sheetRaf = 0;
    if (!d.on) return;
    const last = d.s.at(-1), recent = d.s.filter(x => x[0] >= last[0] - 100), first = recent[0];
    const v = last[0] > first[0] ? (last[1] - first[1]) / (last[0] - first[0]) : 0;   // px/ms, positivo verso il basso
    scrim.classList.remove("drag");
    if (e.type !== "pointercancel" && (d.y > Math.min(160, d.h * .33) || (v > .45 && d.y > 24))) closeSheet(Math.max(v, .8));
    else {
      el.classList.remove("drag");
      if (!calm) { el.style.transition = "transform 240ms var(--e-spring)"; scrim.style.transition = "opacity 200ms var(--e-out)"; }
      el.style.transform = ""; scrim.style.opacity = "";
      sheetTimer = setTimeout(() => { el.style.transition = scrim.style.transition = ""; }, 260);
    }
    setTimeout(() => { sheetDragMoved = false; }, 0);
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("touchmove", e => { if (sheetDrag && sheetDrag.on && e.cancelable) e.preventDefault(); }, {passive: false});   // mentre trascini la scheda non scorre
})();
addEventListener("scroll", () => document.querySelector(".seg").classList.toggle("stuck", scrollY > 90), {passive: true});

// Tema: come il sistema (predefinito), chiaro o scuro. data-theme sul documento, scelta ricordata su questo telefono.
(() => {
  const btn = document.getElementById("thm"), root = document.documentElement;
  const IC = {
    system: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path class="f" d="M12 4a8 8 0 0 1 0 16z"/></svg>`,
    light: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>`,
    dark: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>`};
  const NAME = {system: "come il sistema", light: "chiaro", dark: "scuro"}, NEXT = {system: "light", light: "dark", dark: "system"};
  const metas = [...document.querySelectorAll('meta[name="theme-color"]')].map(m => ({m, media: m.getAttribute("media"), c: m.content}));
  let cur = "system";
  try { const t = localStorage.getItem("pcc-theme"); if (t === "light" || t === "dark") cur = t; } catch (e) {}
  const apply = () => {
    if (cur === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", cur);
    btn.innerHTML = IC[cur];
    btn.title = "Tema: " + NAME[cur];
    btn.setAttribute("aria-label", `Tema: ${NAME[cur]}. Tocca per passare a ${NAME[NEXT[cur]]}`);
    const bg = getComputedStyle(document.body).backgroundColor;   // barra del telefono (app installata) dello stesso colore
    metas.forEach(x => { if (cur === "system") { if (x.media) x.m.setAttribute("media", x.media); x.m.content = x.c; } else { x.m.removeAttribute("media"); x.m.content = bg; } });
  };
  btn.addEventListener("click", () => {
    cur = NEXT[cur]; buzz(6);
    try { if (cur === "system") localStorage.removeItem("pcc-theme"); else localStorage.setItem("pcc-theme", cur); } catch (e) {}
    apply();
  });
  apply();
})();

// Annuncio per il lettore di schermo (riga di stato nascosta, educata: non interrompe)
function say(t) {
  const st = document.getElementById("ptr-s"); if (!st) return;
  st.textContent = ""; requestAnimationFrame(() => { st.textContent = t; });
}

// ——— "Vedi i cambi": dalla rosa attuale alla consigliata, sul campo ———
// Coppie (esce dalla tua rosa → entra nel piano) della giornata i, con gli stessi dati della scheda "Cambi di rosa":
// chi entra si accoppia con chi esce dello stesso ruolo, se c'è. Servono la rosa letta dall'app e la tua rosa nel piano.
function swapPairs(i) {
  if (!D.app || !D.app.attuale || !hasMine() || !D.piano.attuale[i]) return [];
  const g = D.piano.giornate[i], mine = new Set(D.app.attuale.map(p => p.nome));
  const inP = g.giocatori.filter(p => !mine.has(p.nome));
  const outP = D.app.attuale.filter(p => !g.giocatori.some(q => q.nome === p.nome))
    .map(p => D.piano.attuale[i].giocatori.find(q => q.nome === p.nome)).filter(Boolean);
  const left = [...outP];
  return inP.map(x => { let k = left.findIndex(o => o.ruolo === x.ruolo); if (k < 0) k = left.length ? 0 : -1; return [k >= 0 ? left.splice(k, 1)[0] : null, x]; });
}
// Una volta, a richiesta, mai in automatico: chi esce lascia il campo (sfuma e scende), chi entra prende il suo posto.
// Totale entro 900 ms: 200 ms prima del primo arrivo, 300 ms ciascuno, sfasamento al massimo 90 ms (meno se le coppie sono tante).
// Parte solo con il campo in vista (prima lo porta in vista). Con "riduci movimento": nessun movimento, solo il risultato e l'annuncio.
let swapBusy = false;
function seeSwaps(btn) {
  const pitch = document.querySelector("#v-form .pitch"), pairs = swapPairs(day);
  if (!pitch || !pairs.length || swapBusy) return;
  const msg = `Escono ${pairs.filter(x => x[0]).map(x => surname(x[0].nome)).join(", ") || "nessuno"}; entrano ${pairs.map(x => surname(x[1].nome)).join(", ")}.`;
  if (calm) { say(msg); return; }
  swapBusy = true; btn.disabled = true;
  const finish = () => { swapBusy = false; btn.disabled = false; pitch.classList.remove("swapping"); say(msg); };
  const go = () => {
    pitch.classList.add("swapping");
    const pr = pitch.getBoundingClientRect(), g = curG(), n = pairs.length, s = n > 1 ? Math.min(90, 400 / (n - 1)) : 0, anims = [];
    pairs.forEach(([o, x], k) => {
      const inEl = pitch.querySelector(`.pc[data-id="${x.id}"]`); if (!inEl) return;
      const r = inEl.getBoundingClientRect();
      if (o) {
        const t = document.createElement("div"); t.innerHTML = card(o, g); const gh = t.firstElementChild;
        gh.removeAttribute("data-id"); gh.style.viewTransitionName = "none"; gh.classList.add("ghost"); gh.setAttribute("aria-hidden", "true"); gh.tabIndex = -1; gh.inert = true;
        Object.assign(gh.style, {position: "absolute", left: (r.left - pr.left).toFixed(1) + "px", top: (r.top - pr.top).toFixed(1) + "px", width: r.width.toFixed(1) + "px", margin: "0", zIndex: 3});
        pitch.appendChild(gh);
        const a = gh.animate([{opacity: 1, transform: "none"}, {opacity: 0, transform: "translateY(26px) scale(.92)"}], {duration: 300, delay: k * s, easing: "cubic-bezier(.55,0,.75,.4)", fill: "forwards"});
        a.finished.catch(() => {}).finally(() => gh.remove()); anims.push(a);
      }
      anims.push(inEl.animate([{opacity: 0, transform: "translateY(-14px) scale(.96)"}, {opacity: 1, transform: "none"}], {duration: 300, delay: 200 + k * s, easing: "cubic-bezier(.22,1,.36,1)", fill: "backwards"}));
    });
    Promise.all(anims.map(a => a.finished.catch(() => {}))).then(finish);
  };
  // in vista: il campo deve essere sullo schermo almeno per metà (o tutto lo schermo): altrimenti ci si porta prima
  const visible = () => { const r = pitch.getBoundingClientRect(), vis = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0); return vis >= Math.min(r.height * .5, innerHeight * .6); };
  if (visible()) { go(); return; }
  const top = pitch.getBoundingClientRect().top + scrollY - (document.getElementById("mini").offsetHeight + 8);
  scrollTo({top, behavior: "smooth"});
  let last = -1, still = 0, t0 = performance.now();
  const wait = () => {   // aspetta che lo scorrimento si fermi (3 frame uguali) e che il campo sia in vista
    if (Math.abs(scrollY - last) < 1) still++; else still = 0;
    last = scrollY;
    if ((still >= 3 && visible()) || performance.now() - t0 > 1500) { if (visible()) go(); else finish(); return; }
    requestAnimationFrame(wait);
  };
  requestAnimationFrame(wait);
}

// ——— tasto indietro del telefono: chiude guida, anteprima, scheda o ricerca invece di uscire dall'app ———
// Finché qualcosa è aperto c'è UNA voce in più nella cronologia (stato {pcc:"over"}, nessun #hash nell'indirizzo).
// Chiudendo con la X, Esc, il gesto o toccando fuori la voce si toglie da sola (history.back, ignorato qui sotto).
let histOn = false, histSkip = 0;
const qresOpen = () => !document.getElementById("qres").hidden;
const overOpen = () => !!(document.getElementById("tour") && !document.getElementById("tour").hidden) || !!(document.getElementById("shv") && !document.getElementById("shv").hidden)
  || sheetUp();
const sheetUp = () => { const s = document.getElementById("sheet"); return !s.hidden && !s.dataset.closing; };
const anyOpen = () => overOpen() || qresOpen();
function layerOpened() {
  if (histOn) return;
  try { history.pushState({pcc: "over"}, ""); histOn = true; } catch (e) {}
}
function layerClosed() {
  setTimeout(() => { if (!histOn || anyOpen()) return; histOn = false; histSkip++; history.back(); }, 0);
}
// Sfondo inerte (né tocchi né Tab) mentre scheda, anteprima o guida sono aperte: il fuoco resta lì dentro
function syncInert(force) {
  const on = force ?? overOpen();
  document.querySelectorAll(".app, #mini").forEach(x => { x.inert = on; });
}
addEventListener("popstate", () => {
  if (histSkip) { histSkip--; return; }
  histOn = false;   // la voce l'ha consumata il tasto indietro
  const tour = document.getElementById("tour"), shv = document.getElementById("shv");
  if (tour && !tour.hidden) closeTour();
  else if (shv && !shv.hidden) closeShare();
  else if (sheetUp()) closeSheet();
  else if (qresOpen()) { closeSearch(); document.getElementById("q").blur(); }
  if (anyOpen()) layerOpened();   // c'era altro sotto (es. la scheda sotto l'anteprima): resta una voce
});
// dopo un ricaricamento la voce "aperto" non serve più (non c'è niente di aperto): si torna a quella di prima
try { if (history.state && history.state.pcc) { histSkip++; history.back(); } } catch (e) {}

document.getElementById("skip").addEventListener("click", () => { const m = document.getElementById("main"); m.focus({preventScroll: true}); m.scrollIntoView({block: "start"}); });

// ——— memoria della posizione: scorrimento per vista (in questa sessione), filtri del mercato (su questo telefono) ———
try { history.scrollRestoration = "manual"; } catch (e) {}
const SCR = {};
try { Object.assign(SCR, JSON.parse(sessionStorage.getItem("pcc-scroll") || "{}")); } catch (e) {}
let scrT = 0, pendY = null;
const saveScroll = () => { if (!D) return; SCR[view] = Math.round(scrollY); try { sessionStorage.setItem("pcc-scroll", JSON.stringify(SCR)); } catch (e) {} };
addEventListener("scroll", () => { clearTimeout(scrT); scrT = setTimeout(saveScroll, 150); }, {passive: true});
// dopo un disegno: riporta la vista dove l'avevi lasciata (riprova finché la pagina è alta abbastanza, al massimo 1,5 s)
function wantScroll(v) { pendY = {v, y: SCR[v] || 0, t: Date.now()}; tryScroll(); }
function tryScroll() {
  if (!pendY) return;
  if (pendY.v !== view || Date.now() - pendY.t > 1500) { pendY = null; return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  scrollTo({top: Math.min(pendY.y, Math.max(0, max))});
  if (max >= pendY.y - 2) pendY = null;
}
addEventListener("wheel", () => { pendY = null; }, {passive: true});
addEventListener("touchstart", () => { pendY = null; }, {passive: true});

// ——— stato dei dati: "dati di X ore fa" con un colore, e il perché quando qualcosa non va ———
// Soglie (dichiarate anche nel pannello): verde fino a 12 ore, giallo fino a 36 (l'aggiornamento gira ogni mattina: un giro
// saltato), rosso oltre. L'età viene da "aggiornato" in data.json; il motivo da token (diagnosi dell'account), fonti e
// dall'ultimo "tira giù per aggiornare" fallito. Offline (copia del service worker, x-pcc-offline): cosa si può ancora fare.
const FRESH_OK = 12, FRESH_MID = 36;
let lastFail = null;
const dataAge = () => { const [dd, tt] = D.aggiornato.split(" "); return (Date.now() - new Date(dd + "T" + tt + ":00")) / 36e5; };
const ageTxt = h => h < 1 ? "meno di un'ora fa" : h < 48 ? `${Math.round(h)} ${Math.round(h) === 1 ? "ora" : "ore"} fa` : `${Math.round(h / 24)} giorni fa`;
function freshness() {
  const b = document.getElementById("fresh"); if (!b || !D) return;
  const h = dataAge(), off = offline || navigator.onLine === false;
  const lvl = h <= FRESH_OK ? "ok" : h <= FRESH_MID ? "mid" : "lo";
  const prob = (D.token && D.token.ok === false) || lastFail || (D.fonti || []).some(f => !f.ok);
  b.dataset.l = lvl;
  document.getElementById("fresh-t").textContent = `${off ? "Offline · " : ""}dati di ${ageTxt(h)}${prob ? " · da controllare" : ""}`;
  b.setAttribute("aria-label", `${off ? "Sei offline. " : ""}Dati di ${ageTxt(h)}, ${lvl === "ok" ? "freschi" : lvl === "mid" ? "da aggiornare presto" : "vecchi"}${prob ? ", c'è qualcosa da controllare" : ""}. Dettagli`);
  b.hidden = false;
  if (!document.getElementById("fresh-d").hidden) freshPanel();
}
function freshPanel() {
  const p = document.getElementById("fresh-d"), h = dataAge(), off = offline || navigator.onLine === false;
  const [dd, tt] = D.aggiornato.split(" "), F = D.fonti || [], bad = F.filter(f => !f.ok);
  const T = D.token, tok = T && T.ok === false && (T.stato === "token_non_valido" || (!T.stato && /token/i.test(T.motivo || "")));
  const li = [], when = q => { const [a, b] = String(q).split(" "); return /^\d{4}-\d\d-\d\d$/.test(a) ? `${dmy(a)}${b ? " alle " + esc(b) : ""}` : esc(q); };
  li.push(`<li><b>Ultimo aggiornamento:</b> ${dow(dd)} ${dmy(dd)} alle ${esc(tt)} (${ageTxt(h)}). <span class="muted">Verde fino a ${FRESH_OK} ore, giallo fino a ${FRESH_MID}, rosso oltre.</span></li>`);
  if (T) li.push(T.ok === false ? `<li class="bad"><b>${tok ? "Token Dunkest" : "Lettura dall'account Dunkest non riuscita"}:</b> ${esc(T.motivo || "motivo non indicato")}${T.quando ? ` (ultimo tentativo ${when(T.quando)})` : ""}.${T.azione ? ` ${esc(T.azione.charAt(0).toUpperCase() + T.azione.slice(1))}.` : ""}</li>`
    : `<li><b>Account Dunkest:</b> letto${T.quando ? ` il ${when(T.quando)}` : ""}.</li>`);
  if (F.length) li.push(bad.length ? `<li class="bad"><b>Fonti:</b> ${bad.length} su ${F.length} non aggiornate (${bad.map(f => esc(f.nome)).join(", ")}). Dettagli in Modello › Fonti.</li>` : `<li><b>Fonti:</b> tutte e ${F.length} aggiornate.</li>`);
  if (lastFail) li.push(`<li class="bad"><b>Aggiornamento dalla pagina non riuscito</b> alle ${esc(lastFail.ora)}: ${esc(lastFail.motivo)}. Restano i dati di prima.</li>`);
  if (off) li.push(`<li class="off"><b>Sei offline.</b> Stai guardando i dati salvati su questo telefono (${dmy(dd)} alle ${esc(tt)}). Funzionano squadra, piano, opzioni, occasioni, prezzi, infortuni, calcolatore e modello; ricerca, mercato e sostituti ${hasAll() ? "sì (i giocatori sono già caricati)" : "solo se l'elenco di tutti i giocatori era già stato scaricato"}. Tirare giù per aggiornare riprova quando torna la rete.</li>`);
  p.innerHTML = `<ul class="fresh-l">${li.join("")}</ul>`;
}
(() => {
  const b = document.getElementById("fresh"), p = document.getElementById("fresh-d");
  b.addEventListener("click", () => { const open = p.hidden; p.hidden = !open; b.setAttribute("aria-expanded", open); if (open) freshPanel(); buzz(6); });
  setInterval(freshness, 60000);
  addEventListener("online", freshness); addEventListener("offline", freshness);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) freshness(); });
})();

// ——— guida al primo avvio: tre schermate brevi (Squadra, Opzioni, Mercato), saltabili, una volta sola ———
// Dopo la schermata di avvio (mai sopra di lei); riapribile da Modello › Guida. Con "riduci movimento" nessuna animazione.
const TOUR = [
  ["form", "Squadra", "Il campo della giornata con la formazione del piano. In cima <b>Da fare ora</b>: cambi, capitano e avvisi prima della chiusura. Scorri di lato per cambiare giornata, tocca un giocatore per la sua scheda."],
  ["alt", "Opzioni", "Formazioni alternative messe a confronto con la <b>consigliata</b>. Una differenza entro ±1,5 punti è rumore: scegli quella che ti convince."],
  ["occ", "Mercato", "In <b>Occasioni › Mercato</b> tutti i giocatori della lega: filtri per ruolo, squadra e prezzo, ★ per i preferiti e <b>Confronta</b> per metterne due a fianco."]];
let tourK = 0, tourBack = null;
function maybeTour() {
  let seen = true; try { seen = !!localStorage.getItem("pcc-tour"); } catch (e) {}
  if (!seen && D && !document.getElementById("boot")) openTour();
}
function openTour() {
  let el = document.getElementById("tour");
  if (!el) {
    el = document.createElement("div"); el.id = "tour"; el.className = "tour"; el.hidden = true;
    el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-labelledby", "tour-t"); el.setAttribute("aria-describedby", "tour-d");
    document.body.appendChild(el);
    el.addEventListener("click", e => {
      if (e.target.closest("[data-tskip]")) closeTour();
      else if (e.target.closest("[data-tnext]")) { if (tourK < TOUR.length - 1) { tourK++; drawTour(true); } else closeTour(); }
      else if (e.target.closest("[data-tprev]")) { if (tourK > 0) { tourK--; drawTour(true); } }
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeTour(); return; }
      if (e.key === "Tab") {   // il fuoco gira dentro la guida
        const f = [...el.querySelectorAll("button:not([disabled])")]; if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
        else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
      }
    });
  }
  tourBack = document.activeElement; tourK = 0;
  el.hidden = false; drawTour(false); layerOpened(); syncInert(true);
  if (!calm) { el.classList.remove("in"); void el.offsetWidth; el.classList.add("in"); }
}
function drawTour(step) {
  const el = document.getElementById("tour"), [v, t, d] = TOUR[tourK], last = tourK === TOUR.length - 1;
  el.innerHTML = `<div class="tour-c${step && !calm ? " step" : ""}">
    <div class="tour-h"><span class="vh-i">${ic(v === "occ" ? "occ" : v)}</span><span class="lab">${tourK + 1} di ${TOUR.length}</span><button type="button" class="tour-skip" data-tskip>Salta</button></div>
    <h2 id="tour-t">${t}</h2><p id="tour-d">${d}</p>
    <div class="tour-f"><span class="tour-dots" aria-hidden="true">${TOUR.map((_, k) => `<i${k === tourK ? ' class="on"' : ""}></i>`).join("")}</span>
      ${tourK ? `<button type="button" class="btn-o" data-tprev>Indietro</button>` : ""}<button type="button" class="btn" data-tnext>${last ? "Inizia" : "Avanti"}</button></div></div>`;
  el.querySelector("[data-tnext]").focus({preventScroll: true});
}
function closeTour() {
  const el = document.getElementById("tour"); if (!el || el.hidden) return;
  try { localStorage.setItem("pcc-tour", "1"); } catch (e) {}
  el.hidden = true; el.classList.remove("in"); el.innerHTML = ""; syncInert(); layerClosed();
  if (tourBack && tourBack.isConnected && tourBack.focus) tourBack.focus({preventScroll: true});
}

let offline = false;   // l'app installata dà l'ultima copia salvata dei dati quando manca la rete
// Dati nuovi nella pagina (prima apertura o aggiornamento tirando giù). I giocatori di tutta la lega (cerca.json) si
// riscaricano se c'erano già, perché schede e mercato restino coerenti con i dati nuovi.
function applyData(data) {
  const had = hasAll();
  D = data; srchIdx = null; moreP = null;
  if (had) loadAll().catch(() => {});
  try { localStorage.setItem("pcc-seen", "1"); } catch (e) {}
  document.getElementById("team").textContent = D.squadra;
  const [dd, tt] = D.aggiornato.split(" ");
  document.getElementById("upd").textContent = `${offline ? "Offline · dati salvati del" : "Aggiornato"} ${dmy(dd)} alle ${tt}`;
  document.getElementById("mini-t").textContent = D.squadra;
  document.getElementById("mini-u").textContent = `${offline ? "offline · " : ""}${dmy(dd)} · ${tt}`;
  clock();
  avvisi();
  freshness();
}
// Avvio: resta almeno quanto la sua entrata (560 ms dall'apertura), poi sfuma in 200 ms mentre la pagina entra sotto
function bootDone(then) {
  const b = document.getElementById("boot");
  if (!b) { then(); return; }
  setTimeout(() => { then(); b.classList.add("out"); setTimeout(() => b.remove(), 220); }, Math.max(0, 560 - performance.now()));
}
(window.__dp || fetch("data.json", {cache: "no-store"})).then(r => { if (!r.ok) throw new Error(r.status); offline = r.headers.get("x-pcc-offline") === "1"; return r.json(); }).then(data => {
  applyData(data);
  bootDone(() => { render(); wantScroll(view); preloadAll(); setTimeout(maybeTour, calm ? 0 : 260); });
}).catch(err => bootDone(() => {
  document.getElementById("upd").textContent = "";
  document.getElementById("v-form").hidden = false;
  document.getElementById("v-form").innerHTML = `<div class="empty" role="alert">${ILL.err}<b>Non riesco a leggere i dati del piano</b><span>Il file data.json non risponde (errore ${esc(err.message)}). Riprova; se il problema resta, chiedi a Claude di ripubblicare la pagina con <code>python dunkest_cli.py app</code>.</span><button type="button" class="btn" onclick="location.reload()" style="margin-top:6px">Riprova</button></div>`;
  moveIndicator();
}));
moveIndicator();
</script>

<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {const had = !!navigator.serviceWorker.controller; let reloaded = false;navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {}));}</script>
