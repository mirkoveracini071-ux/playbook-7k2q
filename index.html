.ic-s{width:16px;height:16px;vertical-align:-3px}
.ic .f,.seg .f{fill:currentColor;stroke:none}
.badge.inj{display:inline-flex;align-items:center;gap:2px}   /* icona e percentuale sulla stessa riga, alto come prima (19 px) */
.badge .ic{width:11px;height:11px;stroke-width:2.6;vertical-align:-2px}
.pill .ic{width:13px;height:13px;stroke-width:2.2;vertical-align:-2px;margin:0 3px 0 -2px}
.avv > span{display:flex;gap:var(--sp-2);align-items:flex-start}.avv .ic{color:var(--warn-text);margin-top:1px}
.chip-b .ic{width:16px;height:16px;margin:0 5px 0 -3px;vertical-align:-3px}

/* ——— atmosfera: Squadra calda, mercato (Opzioni, Occasioni, Prezzi) fredda, analisi (Infortuni, Calcola, Modello) verde.
   Un velo in cima alla pagina che cambia colore con una transizione della variabile (registrata: si interpola) ——— */
@property --atm{syntax:"<color>";inherits:true;initial-value:transparent}
:root{--atm:var(--atm-sq)}
:root[data-ctx="mk"]{--atm:var(--atm-mk)}
:root[data-ctx="an"]{--atm:var(--atm-an)}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:min(70vh,560px);z-index:-1;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 0%,var(--atm),transparent 72%)}

/* ——— tabellone d'arena: fondo a puntini (lampadine spente), cifre con il "88,8" spento dietro ——— */
.kpis.board,.live,.result,.facts.main{background-color:var(--board);
  background-image:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.05) 1px,transparent 1.4px),linear-gradient(rgba(255,255,255,.035),transparent 45%);
  background-size:5px 5px,100% 100%}
.live{background-size:5px 5px,100% 100%}
/* il font da tabellone non ha cifre a larghezza fissa ("1" è largo metà dell'"8"): sul tabellone ogni cifra sta in una
   cella fissa con l'8 spento dietro, come le cifre a lampadine; così i numeri non ballano quando cambiano */
.sgb{position:relative;isolation:isolate}
.dg{display:inline-block;position:relative;width:.49em;text-align:center}
.dg.one{width:auto}.dg.one::before{content:none}   /* l'1 in una cella piena si leggerebbe come uno spazio ("2 10,5"): resta stretto */
:is(.kpi,.result,.facts,.live) b.sgb span{font:inherit;color:inherit;letter-spacing:inherit;text-transform:none;line-height:inherit;margin:0;padding:0}
.dg::before{content:"8";position:absolute;left:0;right:0;top:0;z-index:-1;color:var(--ghost);text-shadow:none;pointer-events:none}
.board .kpi b,.live .kpi b,.result b,.facts.main b{letter-spacing:.015em;text-shadow:0 0 14px rgba(255,255,255,.08)}
.board .kpi.hi b,.live .kpi.hi b{text-shadow:0 0 16px var(--glow)}
/* rullo: la cifra vecchia esce, la nuova entra (solo transform, < 250 ms) */
.rl{display:inline-block;height:1em;line-height:1;overflow:hidden;vertical-align:top;position:relative}
.rl.dg::before{z-index:-1}
.rl > span{display:block}
.rl i{display:block;height:1em;font-style:normal}

/* ——— testata di ogni vista: icona del menu, titolo, una riga ——— */
.vh{display:grid;grid-template-columns:44px minmax(0,1fr);gap:var(--sp-3);align-items:center;padding-inline:2px}
.vh-i{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--accent-text);
  background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}
.vh-i .ic{width:24px;height:24px}
.vh h2{font:900 1.7rem/.95 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0}
.vh p{font-size:var(--fs-s);color:var(--muted);line-height:1.35;margin-top:3px;text-wrap:pretty}
.board .kpi > span{font-weight:600}

/* ——— carta da collezione (scheda giocatore, Panoramica): testata nei colori della squadra, maglia grande, riflesso fermo ——— */
.cc{position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--card);color:var(--card-ink);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--t2) 55%,var(--card-line)),inset 0 0 0 4px var(--card),inset 0 0 0 5px color-mix(in srgb,var(--t1) 35%,transparent),0 10px 24px -14px var(--shadow-2)}
.cc::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,transparent 30%,rgba(255,255,255,.22) 42%,rgba(255,255,255,.06) 50%,transparent 60%)}
.cc-h{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);padding:8px 14px 7px;background:var(--t1);color:var(--ti);
  font:800 1rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid var(--t2)}
.cc-h span{display:inline-flex;align-items:center;gap:var(--sp-1h)}
.cc-h small{font:700 var(--fs-xs)/1 var(--body);letter-spacing:.06em}
.cc-b{display:grid;grid-template-columns:108px minmax(0,1fr);gap:var(--sp-3);align-items:center;padding:10px 14px 12px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--t1) 16%,var(--card)),var(--card) 70%)}
.cc-j svg.jersey{width:108px;height:auto;display:block;filter:drop-shadow(0 8px 8px var(--jersey-shadow))}
.cc-n{display:grid;gap:var(--sp-1);min-width:0}
.cc-n > b{font:900 2.6rem/.85 var(--display);letter-spacing:-.01em;color:var(--card-ink)}
.cc-n > b small{font-size:.5em;color:var(--card-muted);margin-right:1px;vertical-align:.55em}
.cc-n > span{font:800 1.15rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.cc-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:4px;border-top:1px solid var(--card-line);padding-top:6px}
.cc-st span{display:grid;line-height:1.1;min-width:0}
.cc-st span + span{padding-left:8px;box-shadow:-1px 0 0 var(--card-line)}
.cc-st b{font:800 var(--fn-s)/1 var(--display)}
.cc-st small{font-size:.66rem;color:var(--card-muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ——— conferme: un'etichetta sopra il menu, spunta che si disegna ——— */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:8;transform:translateX(-50%);
  display:flex;align-items:center;gap:var(--sp-2h);max-width:calc(100vw - 32px);padding:9px 16px 9px 10px;border-radius:var(--r-pill);background:var(--fg);color:var(--bg);
  font:600 var(--fs-s)/1.3 var(--body);box-shadow:var(--sh-float);pointer-events:none}
@media (min-width:700px){.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast svg{width:24px;height:24px;flex:none;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.toast .tc{fill:var(--good);stroke:none}.toast .tk{stroke:var(--good-ink)}
.toast.err .tc{fill:var(--bad)}.toast.err .tk{stroke:#fff}

/* ——— tabelle: nome in risalto, numeri da tabellone dove contano ——— */
table td:first-child{font-weight:600}
table td:first-child small,table td:first-child .muted{font-weight:400}
.thr-table td:last-child b{font:800 var(--fn-s)/1 var(--display);letter-spacing:.01em}
.thr-table td:first-child{font-weight:700}
.pz-t td.cur{font-weight:700}
.pz-t td.up,.pz-t td.down{font:800 var(--fn-s)/1.3 var(--display)}
.inj-row .when{font:700 var(--fs-s)/1.4 var(--body);letter-spacing:.02em}
.inj-more{justify-self:center;margin-top:10px}
.inj-list .more:not([hidden]){animation:fade var(--d-state) var(--e-out) backwards}

/* ——— testata: griglia di puntini ferma, sfumata verso il basso e a destra (solo sfondo, nessun movimento) ——— */
.top{position:relative;isolation:isolate}
.top::before{content:"";position:absolute;z-index:-1;inset:-20px calc(-1 * var(--pad-x)) -8px;pointer-events:none;
  background:radial-gradient(circle at 1.5px 1.5px,var(--dots) 1.1px,transparent 1.6px) 0 0/13px 13px;
  -webkit-mask-image:radial-gradient(85% 120% at 12% 0%,#000 25%,transparent 72%);mask-image:radial-gradient(85% 120% at 12% 0%,#000 25%,transparent 72%)}

/* ——— bordo luminoso: un riflesso fa UN giro del bordo (carta del capitano nella scheda, formazione consigliata).
   Anello ritagliato con la maschera (contenuto escluso); l'angolo è una variabile registrata che si interpola. ——— */
@property --beam{syntax:"<angle>";inherits:false;initial-value:0deg}
.cc::before,.alt.rec::before{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;padding:2.5px;pointer-events:none;opacity:0;
  background:conic-gradient(from var(--beam),transparent 0deg 250deg,color-mix(in srgb,var(--beam-c) 40%,transparent) 300deg,var(--beam-c) 345deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.cc{--beam-c:var(--cap)}
.alt.rec{--beam-c:var(--accent)}
.alt.rec::before{inset:-1px}
/* dove la maschera composta non c'è: niente riflesso, il capitano ha un bordo fermo del colore della C */
@supports not ((mask-composite:exclude) or (-webkit-mask-composite:xor)){.cc::before,.alt.rec::before{display:none}.cc.cap{outline:2px solid var(--cap);outline-offset:-2px}}

/* ——— carta da collezione: bagliore che segue il dito o il puntatore (si muove solo con transform) ——— */
.cc{--spot:color-mix(in srgb,var(--t2) 20%,transparent)}
:root[data-theme="dark"] .cc{--spot:rgba(255,255,255,.2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cc{--spot:rgba(255,255,255,.2)}}
/* il bagliore sta sotto maglia e testo (nel corpo della carta), così non sporca le lettere */
.cc-b{position:relative;overflow:hidden}
.cc-b > :not(.cc-sp){position:relative;z-index:1}
.cc-sp{position:absolute;left:0;top:0;z-index:0;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,var(--spot),transparent);will-change:transform}
.cc-sp.on{opacity:1}

/* ——— luce che attraversa "Condividi formazione": una passata alla prima comparsa e a ogni tocco, mai di continuo ——— */
.share-row .btn-o{position:relative;overflow:hidden;isolation:isolate}
.share-row .btn-o::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transform:translateX(-110%);
  background:linear-gradient(105deg,transparent 30%,color-mix(in srgb,var(--accent) var(--shine-k,30%),transparent) 50%,transparent 70%)}
:root[data-theme="dark"] .share-row .btn-o{--shine-k:48%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .share-row .btn-o{--shine-k:48%}}

/* ——— liste a catena (Da fare ora, avvisi, occasioni): le voci entrano una dopo l'altra ——— */
.chain{--dx:0;--dy:8px}

/* ——— striscia degli avvisi sui tuoi (Oggi): scorre solo se sono più di uno e non stanno nella riga ——— */
.mq{display:block;overflow:hidden;min-width:0}
.mq-t{display:flex;width:max-content}
.mq-g{display:flex;gap:var(--sp-1h);padding-right:6px;flex:none}
.mq-g[aria-hidden]{display:none}
.mq.run{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 24px),transparent);cursor:pointer}
.mq.run .mq-g[aria-hidden]{display:flex}
.mq.st .mq-t{width:auto;flex-wrap:wrap}
.mq.st .mq-g{flex:1 1 100%;flex-wrap:wrap;padding-right:0}

/* ——— contenuto principale, salto al contenuto ——— */
.views{display:grid;gap:var(--sp-4);min-width:0}
.views:focus{outline:none}
.fcol{display:contents}
.fcol > *{min-width:0}
.skip{position:fixed;left:var(--sp-2);top:var(--sp-2);z-index:10;min-height:44px;padding:0 var(--sp-4);border:0;border-radius:var(--r-pill);
  background:var(--fg);color:var(--bg);font:600 var(--fs-s)/1 var(--body);transform:translateY(-300%)}
.skip:focus{transform:none}

/* ——— Squadra: "Solo da decidere", "Vedi i cambi" ——— */
.pitch.swapping{position:relative}   /* solo durante "Vedi i cambi" (sempre, cambierebbe l'ordine delle ombre) */
.pc.ghost{pointer-events:none}
.pc.ghost,.pc.ghost *,.pc.ghost *::after{animation:none!important}   /* chi esce in "Vedi i cambi": solo la sua uscita, niente entrata del campo */
.share-row{gap:var(--sp-2);flex-wrap:wrap}
#v-form.dec{width:100%;max-width:640px;justify-self:center}
.dec-t{justify-self:start;display:inline-flex;align-items:center;gap:var(--sp-2);min-height:44px;padding:0 var(--sp-3) 0 var(--sp-2);margin-block:-4px;border:1px solid var(--line);
  border-radius:var(--r-pill);background:var(--surface);color:var(--fg);font:600 var(--fs-s)/1.2 var(--body)}
.dec-k{position:relative;flex:none;width:32px;height:20px;border-radius:var(--r-pill);background:var(--line-2)}
.dec-k::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.dec-t[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.dec-t[aria-pressed="true"] .dec-k{background:var(--accent)}
.dec-t[aria-pressed="true"] .dec-k::after{transform:translateX(12px)}
.dec-c .share-row{margin-top:var(--sp-1)}

/* ——— stato dei dati in testata: pallino verde/giallo/rosso e l'età; il pannello dice il perché ——— */
.fresh{display:inline-flex;align-items:center;min-height:44px;margin-block:-8px;padding:0;border:0;background:none;color:var(--fg)}
.fp{display:inline-flex;align-items:center;gap:var(--sp-1h);min-height:28px;padding:0 var(--sp-2h) 0 var(--sp-2);border:1px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface);font:600 var(--fs-xs)/1.2 var(--body);white-space:nowrap;font-variant-numeric:tabular-nums}
.fd{width:9px;height:9px;border-radius:50%;background:var(--pres-ok);flex:none}
.fresh[data-l="mid"] .fd{background:var(--pres-mid)}
.fresh[data-l="lo"] .fd{background:var(--pres-lo)}
.fresh[data-l="lo"] .fp{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.fresh[aria-expanded="true"] .fp{background:var(--surface-2)}
.fresh-d{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--sp-2h) var(--sp-3);font-size:var(--fs-s);line-height:1.4}
.fresh-l{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp-1h)}
.fresh-l li.bad b{color:var(--bad)}
.fresh-l li.off{border-top:1px solid var(--line);padding-top:var(--sp-1h)}

/* ——— ricerca: filtri rapidi, recenti, squadre ——— */
.srch-fl{display:flex;align-items:center;gap:var(--sp-1h);overflow-x:auto;scrollbar-width:none;padding:var(--sp-1) var(--sp-1) var(--sp-1h);border-bottom:1px solid var(--line);margin-bottom:var(--sp-1)}
.srch-fl::-webkit-scrollbar{display:none}
.srch-c,.srch-s{flex:none;min-height:44px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);color:var(--fg);font:600 var(--fs-s)/1 var(--body)}
.srch-c{min-width:44px;padding:0 var(--sp-3)}
.srch-s{padding:0 var(--sp-2h)}
.srch-c[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.srch-hx{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2)}
.srch-clr{min-height:44px;margin:-12px -6px -10px 0;padding:0 var(--sp-2h);border:0;background:none;color:var(--accent-text);font:700 var(--fs-xs)/1 var(--body);text-transform:uppercase;letter-spacing:.06em}
.srch-g{display:grid}
.srch-t > b{border-left:3px solid var(--tc,var(--line-2));padding-left:var(--sp-2)}
.mkt-t tr[tabindex]:focus-visible{outline:2.5px solid var(--focus);outline-offset:-2px}

/* ——— guida al primo avvio ——— */
.tour{position:fixed;inset:0;z-index:9;display:grid;place-items:end center;background:var(--scrim);
  padding:var(--sp-4) max(var(--sp-4),env(safe-area-inset-right,0px)) calc(var(--sp-4) + env(safe-area-inset-bottom,0px)) max(var(--sp-4),env(safe-area-inset-left,0px))}
@media (min-width:700px){.tour{place-items:center}}
.tour-c{width:min(440px,100%);display:grid;gap:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-sheet);background:var(--surface);color:var(--fg);box-shadow:var(--sh-dialog)}
.tour-h{display:flex;align-items:center;gap:var(--sp-3)}
.tour-h .lab{margin-right:auto}
.tour-skip{min-height:44px;margin:-8px -8px -8px 0;padding:0 var(--sp-3);border:0;border-radius:var(--r-pill);background:none;color:var(--muted);font:600 var(--fs-s)/1 var(--body)}
.tour h2{font:900 1.7rem/.95 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0}
.tour p{font-size:var(--fs-m);line-height:1.45;text-wrap:pretty}
.tour-f{display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-2);flex-wrap:wrap}
.tour-dots{display:flex;gap:var(--sp-1h);margin-right:auto}
.tour-dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.tour-dots i.on{background:var(--accent)}

/* ——— schermi grandi (da 768 px): pagina più larga, Squadra a due colonne (campo a sinistra, cambi, piano e turni a
   destra). Il menu resta la barra in alto (non un menu laterale): le 7 voci ci stanno, la barra di avanzamento #sp sta sul
   suo bordo e una colonna laterale toglierebbe ~200 px alle due colonne. Sotto i 768 px nessuna di queste regole vale. ——— */
@media (min-width:768px){
  .app{max-width:1200px}
  .mini-b{max-width:1200px}
  .views > .view:not(#v-form){width:100%;max-width:880px;justify-self:center}
  #v-form.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:var(--sp-6);align-items:start}
  #v-form.cols > .fcol{display:grid;gap:var(--sp-4);min-width:0;align-content:start}
  #v-form.cols > .f-b{grid-column:1;grid-row:1 / span 2}
  #v-form.cols > .f-a{grid-column:2;grid-row:1}
  #v-form.cols > .f-c{grid-column:2;grid-row:2}
  #v-form.cols > .f-c:first-child,#v-form.cols > .f-b:first-child + .f-c{grid-row:1 / span 2}
  .days{margin-inline:0;padding-inline:0}
  /* tabelle: più aria e il nome intero */
  table{font-size:1rem}
  th,td{padding:10px 12px}
  .scroll td:first-child{min-width:12em}
  .mkt-t td:first-child{max-width:320px}
  .sheet{max-width:680px}
}
/* da 768 a 1023 px la colonna del campo è larga come un telefono (~350 px): carte e spazi come a 390 px */
@media (min-width:768px) and (max-width:1023px){
  .pc{width:clamp(92px,13.6vw,122px)}
  .row .pc{width:min(clamp(92px,13.6vw,122px),calc((100% - 12px) / 3))}
  .row{gap:clamp(8px,2vw,28px)}
}
@media (min-width:1024px){
  .alt-list,.occ-list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .seg button{grid-auto-flow:column;align-content:center;justify-content:center;gap:var(--sp-2)}
}

/* ——— movimento ———
   Regole: si animano solo transform e opacity (eccetto le linee del campo, disegnate una volta).
   press 110 ms · cambi di stato 200 ms · entrate 380 ms · spostamenti 520 ms. Le entrate vengono dalla parte
   da cui arriva il contenuto (vista o giornata a destra o a sinistra). Con "riduci movimento" non c'è
   nessuna di queste regole: la pagina appare subito completa. */
@media (prefers-reduced-motion:no-preference){
  .seg.ready .seg-ind{transition:clip-path var(--d-snap) var(--e-out)}   /* l'indicatore scorre alla voce scelta insieme alla vista */
  .mini{transition:transform var(--d-sheet) var(--e-out),opacity 180ms linear,visibility 0s linear var(--d-sheet)}
  .mini.on{transition:transform 360ms var(--e-out),opacity var(--d-state) linear,visibility 0s}
  .mini-b svg{animation:clock-spin 6s linear infinite}
  .seg.ready button[aria-pressed="true"] svg > *{transform-box:fill-box;transform-origin:center;animation:nav-pop var(--d-snap) var(--e-spring)}
  .mode i{transition:transform var(--d-move) var(--e-out)}
  .pc{transition:transform var(--d-state) var(--e-out)}
  .seg button svg,.days button,.close,.btn{transition:transform var(--d-press) var(--e-out),background-color var(--d-state),border-color var(--d-state),color var(--d-state)}
  @media (hover:hover){.pc:hover{transform:translateY(-3px)}}
  .scrim{transition:opacity var(--d-sheet) var(--e-out)}
  .sheet{transform:translateY(105%);transition:transform var(--d-sheet) var(--e-out)}
  .sheet.open{transform:none}
  .sheet.drag,.sheet.vt{transition:none}
  .sheet.entering .sh-pan:not([hidden]){animation:rise var(--d-state) var(--e-out) 40ms backwards}
  .sh-tabs i,.dens i{transition:transform var(--d-move) var(--e-out)}
  /* numeri che cambiano: lampeggio breve dietro al numero (solo opacità) */
  .bump::after,.pc .tag.bump::after{animation:bump 900ms var(--e-out)}
  /* risultati della ricerca e del mercato: entrata a cascata brevissima */
  .cascade > .srch-r,.cascade tbody tr{animation:rise var(--d-sheet) var(--e-out) backwards;animation-delay:calc(min(var(--k,0),10) * 18ms)}
  .cascade{--dx:0;--dy:6px}
  /* carta -> scheda (View Transitions): la carta si allarga fino a diventare la scheda e ritorno */
  :root.vt-sheet::view-transition-group(*){animation-duration:var(--d-sheet)}   /* menu e barra in alto: fermi, ma la transizione finisce con la scheda */
  ::view-transition-group(shcard){animation-duration:var(--d-sheet);animation-timing-function:cubic-bezier(.2,.85,.25,1)}
  ::view-transition-image-pair(shcard){overflow:hidden;border-radius:var(--r-xl)}
  ::view-transition-old(shcard),::view-transition-new(shcard){height:100%;object-fit:cover;object-position:50% 0}
  ::view-transition-old(shcard){animation:vt-fade-out 120ms ease-out both}
  ::view-transition-new(shcard){animation:vt-fade-in 180ms ease-out 30ms both}
  /* cambio di vista (meno di 250 ms): con View Transitions solo la vista sfuma e scivola un poco dalla parte da cui
     arriva; testata, ricerca e menu restano fermi (il menu è "vivo" e il suo indicatore scorre). Senza View
     Transitions la stessa entrata la fa la vista nuova con un'animazione CSS. */
  .vt-view .view:not([hidden]){view-transition-name:vt-view}
  .vt-view .pc{view-transition-name:none!important}
  :root.vt-view::view-transition-group(*){animation:none}
  :root.vt-view::view-transition-old(root),:root.vt-view::view-transition-new(root),
  :root.vt-view::view-transition-new(vt-nav),:root.vt-view::view-transition-new(vt-mini){animation:none}
  :root.vt-view::view-transition-old(vt-nav),:root.vt-view::view-transition-old(vt-mini){animation:none;opacity:0}
  :root.vt-view::view-transition-old(vt-view){animation:v-out 120ms ease-in both}
  :root.vt-view::view-transition-new(vt-view){animation:v-in var(--d-state) var(--e-out) both}
  .view.v-in{animation:v-in var(--d-state) var(--e-out) both}
  @keyframes v-out{to{opacity:0;transform:translateX(calc(var(--vdx,0) * -12px))}}
  @keyframes v-in{from{opacity:0;transform:translate(calc(var(--vdx,0) * 16px),calc((1 - var(--vdx,0) * var(--vdx,0)) * 6px))}}
  /* nella vista appena arrivata non c'è la cascata delle schede: entra tutta insieme. Restano le barre che si
     riempiono e i numeri che contano */
  .quiet.play,.quiet .pc,.quiet .court svg.lines *,.quiet .badges-l > *,.quiet .badges-r > *,
  .quiet .sw-p > *,.quiet .sw-p .arrow *,.quiet .chip,.quiet .cmp-row,.quiet .src-grid li,.quiet .bar em,.quiet .chart .ar,.quiet .chart .pt{animation:none!important}
  /* barre del confronto fonti (scheda, Statistiche > Altre fonti): si riempiono una dopo l'altra */
  details[open] .sb i{animation:grow 420ms var(--e-out) backwards;animation-delay:calc(60ms + var(--k,0) * 90ms)}
  @keyframes vt-fade-out{to{opacity:0}}
  @keyframes vt-fade-in{from{opacity:0}}
  @keyframes bump{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  .pitch{transition:transform var(--d-move) var(--e-spring)}
  .pitch.drag{transition:none}

  .play{animation:rise var(--d-enter) var(--e-out) backwards;animation-delay:calc(var(--i,0) * var(--stagger))}
  .play .pc{animation:tip 420ms var(--e-spring) backwards;animation-delay:calc(120ms + var(--j,0) * 42ms)}
  .play .court svg.lines g > *{animation:draw 800ms 60ms var(--e-out) backwards}
  .play .court svg.lines > rect,.play .court svg.lines > path,.play .court svg.lines > circle{animation:fade 420ms 100ms backwards}
  .play .cap-b{animation:pop 300ms var(--e-spring) backwards;animation-delay:calc(400ms + var(--j,0) * 42ms)}
  .play .cap-b::after{animation:ring 900ms var(--e-out) 2;animation-delay:calc(700ms + var(--j,0) * 42ms)}
  .play .badges-l > *,.play .badges-r > *{animation:pop 300ms var(--e-spring) backwards;animation-delay:calc(360ms + var(--j,0) * 42ms)}
  /* capitano cambiato (giornata o rosa): la C vola da una maglia all'altra, poi l'anello pulsa due volte */
  .vt-cap .cap-b{view-transition-name:capb}
  ::view-transition-group(capb){z-index:2;animation-duration:460ms;animation-timing-function:cubic-bezier(.3,1.25,.5,1)}
  ::view-transition-group(vt-nav),::view-transition-group(vt-mini){z-index:3}
  .cap-b.moved{animation:none}
  .cap-b.moved::after{animation:ring 900ms var(--e-out) 2}
  .cap-b.flying::after{animation:none}
  .play .bar i{transform-origin:left;animation:grow .8s 300ms var(--e-out) backwards}
  .play .bar em{animation:drop var(--d-enter) .9s var(--e-spring) backwards}
  .play .chart .ln{animation:line 700ms var(--d-state) var(--e-out) backwards}
  .play .chart .ar,.play .chart .pt{animation:fade var(--d-enter) .9s backwards}
  .play .chip.o,.play .chip.i{animation:rise var(--d-enter) var(--e-out) backwards;animation-delay:calc(180ms + var(--k,0) * 40ms)}
  /* cambi in coppia: chi esce arriva da sinistra, la freccia si traccia verso destra, chi entra esce dalla freccia */
  .play .sw-p{--sw:calc(140ms + min(var(--k,0),5) * 70ms)}
  .play .sw-p .o{animation:sw-o 260ms var(--e-out) backwards;animation-delay:var(--sw)}
  .play .sw-p .arrow .sh{animation:sw-line var(--d-state) var(--e-out) backwards;animation-delay:calc(var(--sw) + 120ms)}
  .play .sw-p .arrow .hd{animation:sw-head var(--d-state) var(--e-spring) backwards;animation-delay:calc(var(--sw) + var(--d-snap))}
  .play .sw-p .i{animation:sw-i 300ms var(--e-spring) backwards;animation-delay:calc(var(--sw) + 260ms)}
  @keyframes sw-o{from{opacity:0;transform:translateX(-14px)}}
  @keyframes sw-line{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
  @keyframes sw-head{from{opacity:0;transform:translateX(-6px)}}
  @keyframes sw-i{from{opacity:0;transform:translateX(-18px) scale(.96)}}
  .play .sc-bar i{transform-origin:left;animation:grow .8s var(--e-out) backwards;animation-delay:calc(var(--d-state) + var(--b,0) * 100ms)}
  .sheet.open .spark rect.b{transform-box:fill-box;transform-origin:bottom;animation:rise-bar var(--d-move) var(--e-out) backwards;animation-delay:calc(var(--d-snap) + var(--b,0) * 35ms)}
  .sheet.open .spark .v{animation:fade var(--d-state) backwards;animation-delay:calc(480ms + var(--b,0) * 35ms)}
  .sheet.open .spark .ref{transform-box:fill-box;transform-origin:left;animation:grow 420ms var(--e-out) 260ms backwards}
  .tip{animation:tip-in 140ms var(--e-out)}
  @keyframes tip-in{from{opacity:0;transform:translateY(4px)}}
  .play .cmp-row{animation:rise var(--d-enter) var(--e-out) backwards;animation-delay:calc(80ms + var(--k,0) * 55ms)}
  .play .cmp-bar i{animation:grow .7s var(--e-out) backwards;animation-delay:calc(260ms + var(--k,0) * 70ms)}
  .play .cmp-bar em{animation:pop var(--d-enter) var(--e-spring) backwards;animation-delay:calc(260ms + var(--k,0) * 70ms)}
  .play .tm-bar i,.tab-in .tm-bar i{animation:grow .7s var(--e-out) backwards;animation-delay:calc(120ms + var(--k,0) * 35ms)}
  details[open] .src-grid li,.play .src-grid li{animation:rise var(--d-enter) var(--e-out) backwards;animation-delay:calc(80ms + var(--k,0) * 25ms)}
  .tab-in{animation:rise var(--d-enter) var(--e-out) backwards}
  .tabs i{transition:transform var(--d-move) var(--e-out)}
  .alt.flash::after{animation:flash 1.2s var(--e-out)}
  .cmp-row,.jump a,.tabs button,.more-btn{transition:transform var(--d-press) var(--e-out),background-color var(--d-state),color var(--d-state)}
  .kpi .delta.show{animation:delta 1.6s var(--e-out) both}
  .live-dot::after{animation:ping 1.6s var(--e-out) infinite}
  .sk::after{animation:shimmer 1.3s infinite}
  .boot-ic .jy{animation:boot-j 320ms var(--e-out) both}
  .boot-ic .bl{animation:boot-b 380ms var(--e-spring) 110ms both}
  .boot-ic .cb{transform-box:fill-box;transform-origin:center;animation:pop var(--d-snap) var(--e-spring) 300ms both}
  .boot-c b,.boot-c small{animation:rise var(--d-sheet) var(--e-out) 260ms both}
  .boot-c{--dx:0;--dy:8px}
  @keyframes boot-j{from{opacity:0;transform:translateY(10px)}}
  @keyframes boot-b{from{opacity:0;transform:translateY(-28px)}}
  .ptr.busy svg{animation:spin 700ms linear infinite}
  /* nuovi: interruttore "Solo da decidere" 160 ms, guida (entra 180 ms, passo 160 ms) */
  .dec-k::after,.dec-k{transition:transform 160ms var(--e-out),background-color 160ms}
  .tour.in{animation:fade 180ms ease-out both}
  .tour.in .tour-c{animation:rise var(--d-state) var(--e-out) both;--dx:0;--dy:16px}
  .tour-c.step{animation:fade 160ms ease-out both}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader .ball{animation:bounce .62s cubic-bezier(.5,0,.5,1) infinite alternate}
  .loader .shadow{animation:squash .62s cubic-bezier(.5,0,.5,1) infinite alternate}
  /* luci del palazzetto alla prima apertura: un velo scuro che sfarfalla e si spegne (solo opacità) */
  .court.lights::after{animation:lights 1.3s steps(1,end) both}
  details[open] > :not(summary){animation:rise var(--d-state) var(--e-out) backwards}
  /* View Transitions (cambio di giornata o di rosa): chi resta scivola, chi esce svanisce, chi entra arriva */
  ::view-transition-group(*){animation-duration:var(--d-move);animation-timing-function:var(--e-out)}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:var(--d-state)}
  ::view-transition-old(*):only-child{animation:vt-out var(--d-state) var(--e-out) both}
  ::view-transition-new(*):only-child{animation:vt-in var(--d-enter) var(--e-spring) 120ms both}
  @keyframes rise{from{opacity:0;transform:translate(calc(var(--dx,0) * 24px),var(--dy,12px))}}
  @keyframes tip{from{opacity:0;transform:translateY(18px) scale(.94)}}
  @keyframes pop{from{opacity:0;transform:scale(.5)}}
  @keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
  @keyframes ping{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
  @keyframes draw{from{stroke-dasharray:1600;stroke-dashoffset:1600}to{stroke-dasharray:1600;stroke-dashoffset:0}}
  @keyframes fade{from{opacity:0}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes rise-bar{from{transform:scaleY(0)}}
  @keyframes drop{from{opacity:0;transform:translateY(-10px)}}
  @keyframes line{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
  @keyframes delta{0%{opacity:0;transform:translateY(6px)}15%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
  @keyframes lights{0%{opacity:.82}18%{opacity:.25}24%{opacity:.7}34%{opacity:.05}40%{opacity:.35}52%,100%{opacity:0}}
  @keyframes vt-out{to{opacity:0;transform:scale(.88) translateY(8px)}}
  @keyframes vt-in{from{opacity:0;transform:scale(.86) translateY(-12px)}}
  @keyframes shimmer{to{transform:translateX(100%)}}
  @keyframes bounce{from{transform:translateY(-46px) rotate(-30deg)}to{transform:translateY(0) rotate(40deg)}}
  @keyframes squash{from{transform:scaleX(.45);opacity:.25}to{transform:scaleX(1);opacity:.6}}
  @keyframes flash{0%,35%{opacity:1}100%{opacity:0}}
  /* scheda: le barre delle ultime 5 si riempiono dal basso all'apertura; confronto del mercato: barre di differenza dal centro */
  .sheet.open .f5-b i{animation:rise-bar var(--d-move) var(--e-out) backwards;animation-delay:calc(160ms + var(--b,0) * 50ms)}
  .sheet.open .f5-b em{animation:fade var(--d-state) backwards;animation-delay:480ms}
  .cmpp.in .cmpp-bar i{animation:grow 480ms var(--e-out) backwards;animation-delay:calc(80ms + var(--k,0) * 45ms)}
  .cmpp.in{animation:rise var(--d-enter) var(--e-out) backwards;--dx:0;--dy:8px}
  .fav.pop svg{animation:pop 300ms var(--e-spring)}
  .shv.in{animation:fade 180ms ease-out both}
  .shv.in .shv-c{animation:rise var(--d-sheet) var(--e-out) both;--dx:0;--dy:16px}
  @keyframes nav-pop{from{transform:scale(.6)}}
  /* atmosfera del contesto: il velo cambia colore in 240 ms (niente lampi: si interpola il colore) */
  :root{transition:--atm var(--d-sheet) var(--e-out)}
  /* conferme: entra dal basso (200 ms), la spunta si disegna (220 ms), esce in 160 ms */
  .toast.in{animation:toast-in var(--d-state) var(--e-out) both}
  .toast.in .tk{animation:line var(--d-snap) var(--e-out) 70ms backwards}
  .toast.in .tc{transform-box:fill-box;transform-origin:center;animation:pop var(--d-state) var(--e-spring) both}
  .toast.out{animation:toast-out 160ms ease-in both}
  @keyframes toast-in{from{opacity:0;transform:translate(-50%,12px) scale(.96)}}
  @keyframes toast-out{to{opacity:0;transform:translate(-50%,8px)}}
  /* carta da collezione: entra con la scheda (una volta, 220 ms) */
  .sheet.entering .cc{animation:rise var(--d-snap) var(--e-out) 60ms backwards;--dx:0;--dy:8px}
  /* bordo luminoso: un giro solo (850 ms) all'apertura della scheda del capitano e quando la consigliata entra in vista */
  .cc.beam::before{animation:beam 850ms cubic-bezier(.45,.05,.35,1) 140ms both}
  .alt-list.play .alt.rec::before{animation:beam 850ms cubic-bezier(.45,.05,.35,1) 180ms both}
  @keyframes beam{0%{--beam:0deg;opacity:0}12%{opacity:1}82%{opacity:1}100%{--beam:360deg;opacity:0}}
  /* bagliore della carta: compare e sparisce in 200 ms, la posizione la scrive il JS nel frame di animazione */
  .cc-sp{transition:opacity var(--d-state) var(--e-out)}
  /* luce sul pulsante: una passata (760 ms) */
  .share-row .btn-o.shine::after{animation:shine 760ms var(--e-io) both}
  @keyframes shine{from{opacity:1;transform:translateX(-110%)}to{opacity:1;transform:translateX(110%)}}
  /* liste a catena: 240 ms ciascuna, 45 ms tra una voce e l'altra (al massimo 8 di attesa). Restano anche nella vista
     appena arrivata (lì le schede entrano tutte insieme, le voci di queste liste no) */
  .play .chain > *,.play.chain > *,.avv.chain.play > *{animation:rise var(--d-sheet) var(--e-out) backwards;animation-delay:calc(60ms + min(var(--k,0),8) * 45ms)}
  .chain.play{animation:none}
  /* striscia degli avvisi: l'unica animazione continua, lenta (circa 32 px al secondo); ferma al tocco, sotto il puntatore,
     fuori dallo schermo e a pagina nascosta */
  .mq.run .mq-t{animation:mq var(--mq-d,14s) linear infinite}
  .mq.run:hover .mq-t,.mq.run.paused .mq-t,.mq.run.off .mq-t,:root.bg .mq-t{animation-play-state:paused}
  @keyframes mq{to{transform:translateX(-50%)}}
  /* a pagina nascosta si fermano anche le altre animazioni che girano di continuo */
  .mini:not(.on) .mini-b svg,:root.bg .clock svg,:root.bg .mini-b svg,:root.bg .live-dot::after,:root.bg .sk::after,:root.bg .loader .ball,:root.bg .loader .shadow,:root.bg .ptr.busy svg{animation-play-state:paused}
}
/* "Riduci movimento": nessuna animazione né transizione, nemmeno quelle fuori dal blocco qui sopra (colori dei
   pulsanti, freccia dei dettagli, comparsa della barra di avanzamento). Anche il JS lo controlla (calm). */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

   Durante il controllo (pochi millisecondi) l'avvio resta invisibile e fermo. */
(function () {

  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) { skip(); return; } } catch (e) {}
  var seen = false; try { seen = !!localStorage.getItem("pcc-seen"); } catch (e) {}
  var fallback = function () { if (seen) skip(); };
  try {
    var sw = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
    if (!sw || !window.caches) { fallback(); return; }
    b.classList.add("chk");
    caches.match("data.json").then(function (r) { if (r) skip(); else b.classList.remove("chk"); },
      function () { fallback(); b.classList.remove("chk"); });
