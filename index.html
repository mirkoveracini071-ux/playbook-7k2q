// Testo sul colore della squadra: bianco o quasi nero, quello con più contrasto
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const inkOn = hex => contrast(hex, "#ffffff") >= contrast(hex, "#111418") ? "#ffffff" : "#111418";
// Testata della carta da collezione: il colore della squadra, scurito appena quanto serve per avere almeno 4,5:1 con il testo
// (serve per pochi rossi e blu medi, es. POR 4,34 → 4,5)
function bandOf(hex) {
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, n >> 8 & 255, n & 255];
  for (let f = 1; f >= .5; f -= .03) {
    const h = "#" + ch.map(v => Math.round(v * f).toString(16).padStart(2, "0")).join("");
    if (contrast(h, inkOn(h)) >= 4.5) return h;
  }
  return "#1a1f26";
}

let D = null, day = 0, view = "form", mode = "piano", prevMode = null;
const VIEWS = ["form", "alt", "occ", "prezzi", "inf", "calc", "mod"];
try { const s = JSON.parse(localStorage.getItem("pcc-ui") || "{}"); if (Number.isInteger(s.day)) day = s.day; if (VIEWS.includes(s.view)) view = s.view; if (s.mode) mode = s.mode; } catch (e) {}
const save = () => { try { localStorage.setItem("pcc-ui", JSON.stringify({day, view, mode})); } catch (e) {} };
// Carte del campo: compatte (predefinito) o complete, ricordato su questo telefono
let dens = "c", prevDens = null;
try { const v = localStorage.getItem("pcc-dens"); if (v === "c" || v === "f") dens = v; } catch (e) {}

// Canotta da gioco: spalline, scollo e giro manica nel secondo colore, bande laterali, pieghe del tessuto.
// L'allenatore ha la polo della squadra.
let jid = 0;
const lum = h => { const n = parseInt(h.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const teamTone = t => { const [a, b] = TEAM[t] || ["#4a5561", "#d5dbe1"]; return lum(a) < .03 ? b : a; };   // colore visibile sul nero
function jersey(team, number, coach) {
  const [a, b] = TEAM[team] || ["#4a5561", "#d5dbe1"], id = "j" + (++jid);
  const shade = `<defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient></defs>`;
  if (coach) return `<svg class="jersey" viewBox="0 0 60 60" aria-hidden="true">${shade}
    <path d="M19 6 L25 3.5 Q30 8 35 3.5 L41 6 L53 14 L48 24 L44 21.5 L44 57 Q30 58.5 16 57 L16 21.5 L12 24 L7 14 Z" fill="${a}" stroke="rgba(0,0,0,.25)" stroke-width=".8"/>
    <path d="M12 24 L7 14 L9 12.8 L14 22.8 Z M48 24 L53 14 L51 12.8 L46 22.8 Z" fill="${b}"/>
    <path d="M25 3.5 L30 11 L35 3.5 L33.5 2.5 L30 7 L26.5 2.5 Z" fill="${b}"/><path d="M30 11 V20" stroke="${b}" stroke-width="1"/>
    <circle cx="30" cy="14.5" r=".9" fill="${b}"/><circle cx="30" cy="18" r=".9" fill="${b}"/>
    <text x="38" y="21" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-weight="700" font-size="5" fill="${b}">${esc(team)}</text>
    <text x="30" y="44" text-anchor="middle" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="12" fill="${b}" opacity=".9">HC</text>
    <path d="M19 6 L25 3.5 Q30 8 35 3.5 L41 6 L53 14 L48 24 L44 21.5 L44 57 Q30 58.5 16 57 L16 21.5 L12 24 L7 14 Z" fill="url(#${id})"/></svg>`;
  const la = lum(a), lb = lum(b), num_c = (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05) < 2.5 ? "#ffffff" : b;   // numero leggibile
  const body = "M17 3 H23.5 Q30 12.5 36.5 3 H43 Q43.5 13.5 50 17.5 V57 Q30 59 10 57 V17.5 Q16.5 13.5 17 3 Z";
  return `<svg class="jersey" viewBox="0 0 60 60" aria-hidden="true">${shade}
    <path d="${body}" fill="${a}"/>
    <path d="M10 18 L13.5 17 V57.3 L10 57 Z M50 18 L46.5 17 V57.3 L50 57 Z" fill="${b}" opacity=".9"/>
    <path d="M14.5 56.6 Q30 58.4 45.5 56.6" stroke="${b}" stroke-width="1.2" fill="none" opacity=".7"/>
    <g fill="none" stroke="${b}" stroke-width="2.2" stroke-linecap="round"><path d="M23.5 3 Q30 12.5 36.5 3"/><path d="M17 3 Q16.5 13.5 10 17.5"/><path d="M43 3 Q43.5 13.5 50 17.5"/></g>
    <text x="30" y="24.5" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-weight="700" font-size="6" letter-spacing=".4" fill="${b}">${esc(team)}</text>
    <text x="30" y="47" text-anchor="middle" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="20" fill="${num_c}" stroke="${num_c === b ? a : b}" stroke-width="1.4" paint-order="stroke">${esc(number ?? "")}</text>
    <path d="M24 30 Q25 44 23 56 M36 30 Q35 44 37 56" stroke="#000" stroke-opacity=".07" stroke-width="1.2" fill="none"/>
    <path d="${body}" fill="url(#${id})"/><path d="${body}" fill="none" stroke="rgba(0,0,0,.28)" stroke-width=".7"/></svg>`;
}

function formArrow(f) {
  if (!f || !f.stato || f.stato === "stabile") return "";
  const up = f.stato === "in forma";
  return `<em class="form ${up ? "up" : "down"}" title="${up ? "In forma" : "In calo"}: ultime 5 ${num(f.media_5)} contro media ${num(f.media)}">${up ? "▲" : "▼"}</em>`;
}

function cardStats(p) {
  const st = playerStats(p);
  if (!st) return "";
  return `<span class="st3" title="Punti, rimbalzi, assist attesi a partita${st.src ? " (stima: " + esc(st.src) + ")" : ""}"><span><b>${num(st.pts, 1)}</b><small>pt</small></span><span><b>${num(st.reb, 1)}</b><small>rb</small></span><span><b>${num(st.ast, 1)}</b><small>as</small></span></span>`;
}

function card(p, g) {
  p = adj(p);
  const info = D.giocatori[p.nome] || {};
  const coach = p.ruolo === "HC";
  const opp = (p.partita || "").replace(/^\d\d\/\d\d\s*/, "").toUpperCase() || "RIPOSO";
  const turno = coach ? "" : p.turno ? `T${p.turno}` : "–";
  const isCap = g.capitano.length && g.capitano[0].id === p.id;
  const rest = !coach && !p.turno, out = leaving.has(p.nome);
  const prob = info.assente ?? (info.infortunio ? p.p_gioca : null);   // solo assenti.txt o lista infortuni
  const left0 = [
    p.nuovo ? `<span class="badge new">NUOVO</span>` : out ? `<span class="badge esce" title="Il piano lo cambia">ESCE</span>` : "",
    info.quintetto && !coach ? `<span class="badge role ${info.quintetto.titolare ? "tit" : "pan"}${info.quintetto.confermato ? "" : " prev"}" title="${info.quintetto.titolare ? "Titolare" : "Dalla panchina"} (${info.quintetto.confermato ? "quintetto confermato" : "quintetto previsto"}) · ${esc(info.quintetto.partita)}">${info.quintetto.titolare ? "TIT" : "PAN"}</span>` : ""
  ];
  let right = rest ? `<span class="badge rest">RIPOSO</span>` : (prob != null && prob < 1 ? `<span class="badge inj ${presCls(prob)}" title="Probabilità di giocare: ${PRES_TXT[presCls(prob)]}">${ic(presCls(prob))}${Math.round(prob * 100)}%</span>` : "");
  // sulla carta del capitano in alto a destra c'è la C (che resta dov'è): il bollino passa a sinistra, sotto gli altri.
  // Sotto la C non c'è posto: tra la C e il nome restano meno dei 19 px del bollino fino a 375 px di schermo.
  const left = left0.join("") + (isCap ? right : "");
  if (isCap) right = "";
  const cls = ["pc", rest ? "out" : "", isCap ? "is-cap" : "", p.nuovo ? "is-new" : "", out ? "leaving" : ""].filter(Boolean).join(" ");
  const state = [isCap ? "capitano" : "", p.nuovo ? "nuovo" : "", out ? "esce col piano" : "", rest ? "riposa" : ""].filter(Boolean).join(", ");
  const se = seGioca(p), seTitle = se ? `Probabilità di giocare ${Math.round(p.p_gioca * 100)}%: i punti attesi sono già ridotti` : "";
  let body;
  if (dens === "c") {   // compatta: punti · crediti · turno, poi una riga piccola con "se gioca" e PT·RB·AS
    const st = playerStats(p);
    const s3 = st ? `<span class="s3" title="Punti, rimbalzi, assist attesi a partita${st.src ? " (stima: " + esc(st.src) + ")" : ""}"><b>${num(st.pts, 0)}</b><b>${num(st.reb, 0)}</b><b>${num(st.ast, 0)}</b></span>` : "";
    const sl = se ? `<span title="${seTitle}">se gioca <b>${num(se)}</b>${p._adj ? " ✎" : ""}</span>` : "";
    body = `<span class="k3"><span class="k"><b data-cnt="c${p.id}">${num(p.punti)}</b><small>pt</small></span><span><b>${cr(p.crediti)}</b><small>cr</small></span><span><b>${turno || "HC"}</b><small>${esc(opp)}</small></span></span>
    ${sl || s3 ? `<span class="ln">${sl}${s3}</span>` : ""}`;
  } else {
    body = `<span class="info"><span><b>${cr(p.crediti)}</b><small>cr</small></span><span><b>${turno || "HC"}</b><small>${esc(opp)}</small></span></span>
    <span class="pts" style="display:block"><b data-cnt="c${p.id}">${num(p.punti)}</b> pt attesi${se ? `<small class="se" title="${seTitle}">${num(se)} se gioca${p._adj ? " ✎" : ""}</small>` : ""}</span>${cardStats(p)}`;
  }
  return `<button type="button" class="${cls}" style="--tc:${teamTone(p.squadra)};view-transition-name:p${p.id}" data-id="${p.id}" aria-label="${esc(p.nome)}${state ? ", " + state : ""}: ${num(p.punti)} punti attesi, dettagli">
    ${left ? `<span class="badges-l">${left}</span>` : ""}${right ? `<span class="badges-r">${right}</span>` : ""}${isCap ? `<span class="cap-b" title="Capitano">C</span>` : ""}${jersey(p.squadra, info.maglia, coach)}
    <span class="tag"><span class="nm" style="display:block"><i>${ROLE[p.ruolo]}</i>${esc(surname(p.nome))}${formArrow(info.forma)}</span>
    ${body}</span></button>`;
}

// Linee in scala: area 16x19 piedi, lunetta raggio 6, arco da tre a 23,75 dal ferro (dritto negli angoli), area senza sfondamento 4
// Le linee sono disegnate due volte: sotto un filo d'ombra spostato di poco (vernice sul legno), sopra la linea bianca.
const COURT_PATHS = `<rect x="170" y="0" width="160" height="190"/><path d="M190 190 A60 60 0 0 0 310 190"/><path d="M190 190 A60 60 0 0 1 310 190" stroke-dasharray="7 7"/>
    <path d="M30 0 V140 A237.5 237.5 0 0 0 470 140 V0"/><path d="M210 52.5 A40 40 0 0 0 290 52.5"/>
    <path d="M170 70 h-8 M170 110 h-8 M170 140 h-8 M330 70 h8 M330 110 h8 M330 140 h8"/>`;
const courtLines = `<svg class="lines" viewBox="0 0 500 470" preserveAspectRatio="xMidYMin meet" aria-hidden="true">
  <defs><linearGradient id="paint-g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--paint)" stop-opacity=".72"/><stop offset="1" stop-color="var(--paint)" stop-opacity=".52"/></linearGradient></defs>
  <rect x="170" y="0" width="160" height="190" fill="url(#paint-g)"/>
  <path d="M190 190 A60 60 0 0 0 310 190 Z" fill="var(--paint)" opacity=".3"/>
  <rect x="162" y="78" width="8" height="5" fill="var(--wood-line)"/><rect x="330" y="78" width="8" height="5" fill="var(--wood-line)"/>
  <g class="sh" fill="none" stroke="rgba(50,22,0,.22)" stroke-width="2" vector-effect="non-scaling-stroke" transform="translate(0 1.6)">${COURT_PATHS}</g>
  <g fill="none" stroke="var(--wood-line)" stroke-width="2" vector-effect="non-scaling-stroke">${COURT_PATHS}</g>
  <rect x="218" y="36.5" width="64" height="6" rx="1.5" fill="rgba(20,10,0,.28)" transform="translate(0 3)"/>
  <rect x="218" y="36.5" width="64" height="6" rx="1.5" fill="var(--wood-line)"/>
  <path d="M243 58 L245.5 74 H254.5 L257 58 M247 60 L249.5 74 M253 60 L250.5 74 M244 66 H256" fill="none" stroke="var(--wood-line)" stroke-width="1" opacity=".75" vector-effect="non-scaling-stroke"/>
  <circle cx="250" cy="52.5" r="7.5" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
const courtMid = name => `<svg class="lines mid" viewBox="0 0 500 72" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <path d="M190 72 A60 60 0 0 1 310 72 Z" fill="var(--paint)" opacity=".5"/>
  <g fill="none" stroke="rgba(50,22,0,.22)" stroke-width="2" vector-effect="non-scaling-stroke" transform="translate(0 1.6)"><path d="M190 72 A60 60 0 0 1 310 72"/></g>
  <g fill="none" stroke="var(--wood-line)" stroke-width="2" vector-effect="non-scaling-stroke"><path d="M190 72 A60 60 0 0 1 310 72"/><path d="M230 72 A20 20 0 0 1 270 72" opacity=".7"/></g>
  <text x="250" y="62" text-anchor="middle" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="11" letter-spacing=".5" fill="var(--wood-line)" opacity=".95" textLength="${Math.min(96, name.length * 7.4)}" lengthAdjust="spacingAndGlyphs">${esc(name.toUpperCase())}</text></svg>`;

let leaving = new Set();
const hasMine = () => !!(D.piano.attuale && D.piano.attuale.length);
const curG = (i = day) => mode === "mia" && hasMine() ? D.piano.attuale[i] : D.piano.giornate[i];
const today = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; };
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

function renderForm() {
  if (!hasMine()) mode = "piano";
  const g = curG(), plan = D.piano.giornate[day];
  leaving = new Set(mode === "mia" ? g.giocatori.filter(p => !plan.giocatori.some(q => q.nome === p.nome)).map(p => p.nome) : []);
  const P = g.giocatori;
  const st = P.filter(p => p.slot === "titolare").sort((a, b) => ROLE_ORDER[a.ruolo] - ROLE_ORDER[b.ruolo]);
  const rows = [0, 1, 2].map(r => st.filter(p => ROLE_ORDER[p.ruolo] === r)).filter(r => r.length);
  const six = P.find(p => p.slot === "sesto uomo");
  const bench = P.filter(p => p.slot === "panchina").sort((a, b) => (a.turno || 9) - (b.turno || 9));
  const coach = P.find(p => p.ruolo === "HC");
  const byId = Object.fromEntries(P.map(p => [p.id, p]));
  const nm = id => esc(byId[id]?.nome ?? "?");
  const range = g.p90 - g.p10, lo = Math.max(0, g.p10 - range * .25), hi = g.p90 + range * .25, x = v => ((v - lo) / (hi - lo) * 100).toFixed(1);
  const now = activeIdx();

  const days = D.piano.giornate.map((d, i) => `<button type="button" data-day="${i}" aria-pressed="${i === day}"${i === now ? ` class="now" title="Giornata in corso o prossima"` : ""}><b>${esc(d.label)}</b><span>${dmy(d.dal)}–${dmy(d.al)}</span></button>`).join("");
  const kpis = `<div class="kpis board">
    <div class="kpi hi"><b>${num(g.punti)}</b><span>punti attesi</span></div>
    <div class="kpi"><b>${g.malus ? "−" + num(g.malus, 0) : "0"}</b><span>malus cambi</span></div>
    <div class="kpi"><b>${g.plus_cr != null ? sign(g.plus_cr, 2) : sign(g.plus)}</b><span>${g.plus_cr != null ? "crediti attesi" : "plus attesa (pt)"}</span></div>
    <div class="kpi"><b>${cr(g.crediti)}</b><span>crediti / ${cr(D.piano.budget)}</span></div></div>`;
  const densRow = `<div class="dens-row"><span class="lab" id="dens-l">Carte</span><div class="dens" data-d="${prevDens || dens}" role="group" aria-labelledby="dens-l"><i aria-hidden="true"></i>
    <button type="button" data-dens="c" aria-pressed="${dens === "c"}">Compatta</button><button type="button" data-dens="f" aria-pressed="${dens === "f"}">Completa</button></div></div>`;
  const pitch = `${densRow}<div class="pitch${dens === "c" ? " compact" : ""}"><div class="court">${courtLines}${courtMid(D.squadra || "")}${rows.map(r => `<div class="row">${r.map(p => card(p, g)).join("")}</div>`).join("")}</div>
    <div class="bench"><div class="col"><div><h3><b>6° uomo</b> · 100%</h3>${six ? card(six, g) : ""}</div><div><h3><b>Coach</b></h3>${coach ? card(coach, g) : ""}</div></div>
    <div class="pan"><h3><b>Panchina</b> · 50%</h3><div class="grid">${bench.map(p => card(p, g)).join("")}</div></div></div></div>
    <p class="hint">${dens === "c" ? "In basso sulla carta: punti se gioca e punti · rimbalzi · assist a partita. " : ""}${D.piano.giornate.length > 1 ? "Scorri di lato per cambiare giornata · tocca un giocatore per i dettagli" : "Tocca un giocatore per i dettagli"}</p>
    <div class="share-row">${swapPairs(day).length && mode === "piano" ? `<button type="button" class="btn-o" id="see-sw" aria-describedby="see-sw-d">${ic("alt")}Vedi i cambi</button><span class="sr" id="see-sw-d">Mostra sul campo chi esce dalla tua rosa e chi entra al suo posto</span>` : ""}<button type="button" class="btn-o" id="share-f">${ic("share")}Condividi formazione</button></div>`;

  // Cambi del piano rispetto alla giornata prima. Se coincidono con i "Cambi di rosa" (rispetto all'app) non li ripeto.
  const diff = mode === "mia" ? "" : diffCard(g);
  const appIn = D.app && D.app.attuale ? g.giocatori.filter(p => !D.app.attuale.some(q => q.nome === p.nome)).map(p => p.nome) : null;
  const dup = diff && appIn && sameSet(appIn, g.dentro);
  const changes = !g.dentro.length ? `<div class="card">${head(`Cambi del piano · ${esc(g.label)}`)}<p class="muted">Nessun cambio: tieni la rosa così.</p></div>`
    : dup ? `<div class="card">${head(`Cambi del piano · ${esc(g.label)}`)}<p class="muted">Sono i ${g.dentro.length} cambi di rosa qui sopra (${g.fuori.map(n => esc(surname(n))).join(", ")} → ${g.dentro.map(n => esc(surname(n))).join(", ")}). ${g.malus ? `Malus: −${num(g.malus, 0)} punti in questa giornata.` : "Senza malus."}</p></div>`
    : `<div class="card">${head(`Cambi prima della ${esc(g.label)}`, g.malus ? `malus −${num(g.malus, 0)}` : "senza malus")}
    ${swapList(g.fuori.map(n => [n]), g.dentro.map(n => [n]))}
    <p class="muted">${g.malus ? `Malus: −${num(g.malus, 0)} punti in questa giornata.` : "Senza malus."}</p></div>`;

  const starters = new Set(st.map(p => p.id));
  const turns = `<div class="card">${head("Turni", `${g.turni.length} ${g.turni.length === 1 ? "turno" : "turni"}`)}<div class="turns">${g.turni.map(t => `<div class="turn"><div class="t">T${t.turno}<small>${dow(t.data)} ${dmy(t.data)}</small></div>
    <div class="chips">${t.giocatori.map(id => `<span class="chip${starters.has(id) ? " st" : ""}">${esc(surname(byId[id]?.nome ?? "?"))}</span>`).join("")}</div></div>`).join("")}
    ${g.riposo.length ? `<div class="turn"><div class="t">—<small>riposo</small></div><div class="chips">${g.riposo.map(id => `<span class="chip">${esc(surname(byId[id]?.nome ?? "?"))}</span>`).join("")}</div></div>` : ""}
    </div><p class="legend"><span><i class="st"></i>Pieni = titolari a inizio giornata</span><span><i></i>Vuoti = panchina</span></p></div>`;

  const cap = `<div class="card">${head("Capitano", "fascia ×1,5")}<ol class="steps">${g.capitano.map((c, k) => `<li><span class="dot">T${c.turno}</span>
    <div><div class="who">${nm(c.id)}</div><div class="thr">${c.soglia != null ? `Tienilo se fa almeno <b>${c.soglia}</b> punti, altrimenti la fascia passa a ${nm(g.capitano[k + 1].id)}.` : "Ultimo candidato: tienilo."}</div></div></li>`).join("")}</ol></div>`;

  const subs = g.sostituzioni.length ? `<div class="card">${head("Sostituzioni")}<div class="subs">${g.sostituzioni.map(s => `<div class="grp">
    <b>Dopo il T${s.dopo_turno}</b><span class="muted">Se il peggiore tra ${s.titolari.map(nm).join(", ")} delude, togli lui e metti:</span>
    <ol>${s.opzioni.map(o => `<li>${nm(o.entra)} (T${o.turno}) se il titolare ${o.ruoli.map(r => ROLE[r]).join("/")} fa meno di <b>${o.soglia}</b></li>`).join("")}</ol></div>`).join("")}
    <p class="note">Se un titolare è dato out prima della partita, sostituiscilo subito con il miglior panchinaro che non ha ancora giocato.</p></div></div>` : "";

  const rng = `<div class="card">${head("Punteggio realistico", "8 giornate su 10 qui dentro")}<div class="range">
    <div class="bar"><i style="left:${x(g.p10)}%;right:${(100 - x(g.p90)).toFixed(1)}%"></i><em style="left:calc(${x(g.punti)}% - 2px)"></em></div>
    <div class="bar-l"><span>${g.p10} <small>(10%)</small></span><span>atteso <b>${num(g.punti)}</b></span><span>${g.p90} <small>(90%)</small></span></div></div></div>`;

  const mine = hasMine() ? D.piano.attuale[day] : null;
  const toggle = mine ? `<div class="mode" data-m="${prevMode || mode}" role="group" aria-label="Quale rosa"><i aria-hidden="true"></i>
    <button type="button" data-mode="piano" aria-pressed="${mode === "piano"}"><span>Il piano</span><b data-cnt="mp">${num(plan.punti)}</b></button>
    <button type="button" data-mode="mia" aria-pressed="${mode === "mia"}"><span>La mia rosa</span><b data-cnt="mm">${num(mine.punti)}</b></button></div>` : "";
  const top = mode === "mia" ? compareCard(day) : diff;
  // tre gruppi: sul telefono (display:contents) è la stessa colonna di sempre; da 768 px il campo va a sinistra (b),
  // "Da fare ora" e il resto del piano a destra (a sopra, c sotto)
  const el = document.getElementById("v-form");
  const dec = decideOn();
  el.classList.toggle("dec", dec);
  if (dec) {   // prima della chiusura: solo cambi, capitano, avvisi e Condividi (gli stessi dati di "Da fare ora")
    el.classList.remove("cols");
    el.innerHTML = `<div class="fcol f-a">${todoCard(true)}</div>`;
    return;
  }
  const fa = `${todayCard()}${todoCard()}${liveCard()}${lastDay()}`;
  el.classList.add("cols");
  el.innerHTML = `${fa ? `<div class="fcol f-a">${fa}</div>` : ""}<div class="fcol f-b"><div class="days" role="group" aria-label="Giornata">${days}</div>${toggle}${kpis}${pitch}</div><div class="fcol f-c">${top}${mode === "mia" ? "" : changes}${cap}${turns}${subs}${rng}</div>`;
}

// Rosa attuale contro piano: quanto rendono i cambi, nella giornata e su tutte quelle del piano
function compareCard(i) {
  const a = D.piano.attuale, p = D.piano.giornate, g = p[i], m = a[i];
  const d = g.punti - m.punti, tot = p.reduce((s, x) => s + x.punti, 0) - a.reduce((s, x) => s + x.punti, 0);
  const out = m.giocatori.filter(x => leaving.has(x.nome));
  return `<div class="card">${head("La tua rosa senza cambi", esc(g.label))}
    <div class="kpis" style="--n:2"><div class="kpi ${d > 0.05 ? "hi" : ""}"><b>${sign(d)}</b><span>piano in ${esc(g.label)}</span></div><div class="kpi ${tot > 0.05 ? "hi" : ""}"><b>${sign(tot)}</b><span>piano su ${p.length} giornate</span></div></div>
    <p>${d > 0.05 ? `Il piano fa <b>${sign(d)}</b> punti attesi in ${esc(g.label)}` : d < -0.05 ? `In ${esc(g.label)} la tua rosa fa <b>${sign(-d)}</b> punti più del piano (che pensa alle giornate dopo)` : `In ${esc(g.label)} piano e rosa si equivalgono`}${g.malus ? `, già tolto il malus di ${num(g.malus, 0)}` : ""}.
      Su ${p.length} giornate: <b>${sign(tot)}</b> punti per il piano.</p>
    ${out.length ? `<p class="muted">Il piano cambia ${out.map(x => `<b>${esc(surname(x.nome))}</b> (${num(x.punti)})`).join(", ")}: hanno il cartellino ESCE sul campo.</p>` : `<p class="muted">Nessun cambio in questa giornata.</p>`}
    ${m.plus_cr != null && g.plus_cr != null ? `<p class="muted">Crediti attesi: rosa ${sign(m.plus_cr, 2)}, piano ${sign(g.plus_cr, 2)}.</p>` : ""}</div>`;
}

// La giornata che conta adesso: quella in corso o la prossima
function activeIdx() {
  const t = today(), i = D.piano.giornate.findIndex(g => g.al >= t);
  return i < 0 ? D.piano.giornate.length - 1 : i;
}

// Oggi: in cima a Squadra, quello che serve sapere aprendo l'app. Solo dati veri: le date dei turni ci sono, l'orario
// della prima partita (cioè della chiusura dei cambi) in data.json non c'è, quindi il conto è in giorni e non in ore.
const daysTo = d => Math.round((new Date(d + "T12:00:00") - new Date(today() + "T12:00:00")) / 864e5);
function todayCard(frag) {
  const i = activeIdx(), g = D.piano.giornate[i], t = today();
  const mg = hasMine() ? D.piano.attuale[i] : g;
  const A = D.app && D.app.attuale ? D.app.attuale : null;
  const mineNames = A ? A.map(p => p.nome) : (D.rosa || []);
  // prossimo turno con dentro i tuoi giocatori: in questa giornata, altrimenti nella prossima
  let tg = mg, nt = (mg.turni || []).find(x => x.data >= t);
  if (!nt && D.piano.giornate[i + 1]) { tg = hasMine() ? D.piano.attuale[i + 1] : D.piano.giornate[i + 1]; nt = (tg.turni || [])[0]; }
  const started = g.dal <= t;
  const dl = started ? (nt ? nt.data : null) : g.dal, n = dl ? daysTo(dl) : null;
  const byId = Object.fromEntries((tg.giocatori || []).map(p => [p.id, p]));
  const inTurn = nt ? nt.giocatori.map(id => byId[id]).filter(Boolean) : [];
  // avvisi sui tuoi: lista infortuni (non "available") o stima di assenza sotto il 100%
  const warn = mineNames.map(nm => {
    const info = D.giocatori[nm] || {}, inj = info.infortunio, abs = info.assente;
    if (!((inj && !/available/i.test(inj.stato)) || (abs != null && abs < 1))) return null;
    const pr = abs != null ? abs : inj && /out/i.test(inj.stato) && !/question/i.test(inj.stato) ? 0 : .5;
    return {nm, pr, st: inj ? inj.stato : "in dubbio", abs};
  }).filter(Boolean);
  const c = g.capitano[0], cp = c && g.giocatori.find(p => p.id === c.id), capNowA = A && A.find(p => p.capitano);
  if (!frag && !started) return "";   // prima della giornata i numeri stanno dentro "Da fare ora"
  const kDays = n == null ? "–" : n <= 0 ? "oggi" : String(n);
  const kDaysL = started ? (nt ? `giorni al T${nt.turno}` : "giornata finita") : `giorni alla ${esc(g.label)}`;
  const body = `<div class="kpis" style="--n:3"><div class="kpi hi"><b>${kDays}</b><span>${kDaysL}</span></div>
      <div class="kpi"><b>${inTurn.length}</b><span>${nt ? `in campo nel T${nt.turno}` : "in campo"}</span></div>
      <div class="kpi"><b>${warn.length}</b><span>${warn.length === 1 ? "avviso" : "avvisi"} in rosa</span></div></div>
    <ul class="td-l">
      ${nt ? `<li><span class="lab">Prossimo</span><span><b>${esc(tg.label)} · T${nt.turno}</b>, ${dow(nt.data)} ${dmy(nt.data)}: ${inTurn.map(p => esc(surname(p.nome))).join(", ") || "nessuno dei tuoi"}</span></li>` : ""}
      ${!started ? `<li><span class="lab">Cambi</span><span>Entro l'inizio della ${esc(g.label)}, ${dow(g.dal)} ${dmy(g.dal)}. <span class="muted">L'orario della prima partita non è nei dati della pagina: il conto è in giorni.</span></span></li>` : ""}
      ${cp ? `<li><span class="lab">Capitano</span><span><span class="badge-inline">C</span> <b>${esc(cp.nome)}</b> (T${c.turno})${capNowA ? capNowA.nome === cp.nome ? " · ha già la fascia" : ` · ora ce l'ha ${esc(surname(capNowA.nome))}` : ""}</span></li>` : ""}
      <li><span class="lab">Avvisi</span>${warn.length ? warnStrip(warn) : `<span class="muted">Nessun tuo giocatore nella lista infortuni.</span>`}</li>
    </ul>`;
  // dentro "Da fare ora": solo i numeri e il prossimo turno, il resto (cambi, capitano, avvisi) è già nell'elenco
  if (frag) return `<div class="kpis" style="--n:2"><div class="kpi hi"><b>${kDays}</b><span>${kDaysL}</span></div>
      <div class="kpi"><b>${inTurn.length}</b><span>${nt ? `in campo nel T${nt.turno}` : "in campo"}</span></div></div>
    ${nt ? `<p class="td-next"><span class="lab">Prossimo</span> <b>${esc(tg.label)} · T${nt.turno}</b>, ${dow(nt.data)} ${dmy(nt.data)}</p>` : ""}`;
  return `<div class="card today">${head("Oggi", `${dow(t)} ${dmy(t)}`)}${body}</div>`;
}

// Avvisi sui tuoi in Oggi: con uno solo una pillola ferma; con più di uno una striscia che scorre piano se non sta nella
// riga (la decide mqSetup dopo il disegno), con una seconda copia nascosta al lettore di schermo per il giro senza salti.
function warnStrip(warn) {
  const items = warn.map((w, k) => `<span class="ti" style="--k:${k}"><i class="pd ${presCls(w.pr)}" aria-hidden="true"></i>${esc(surname(w.nm))} · ${esc(w.st)}${w.abs != null ? ` (${Math.round(w.abs * 100)}%)` : ""}</span>`).join("");
  if (warn.length < 2) return `<span class="td-inj chain">${items}</span>`;
  return `<span class="td-inj mq" title="Tocca per fermare o far ripartire"><span class="mq-t"><span class="mq-g chain">${items}</span><span class="mq-g" aria-hidden="true">${items}</span></span></span>`;
}

// "Solo da decidere": vista compatta di Squadra prima della chiusura dei cambi (ricordata su questo telefono).
// Vale solo finché c'è "Da fare ora", cioè prima dell'inizio della giornata.
let decide = false;
try { decide = localStorage.getItem("pcc-decide") === "1"; } catch (e) {}
const todoNow = () => D.piano.giornate[activeIdx()].dal > today();
const decideOn = () => decide && todoNow();
function setDecide(on) {
  decide = on; try { localStorage.setItem("pcc-decide", on ? "1" : "0"); } catch (e) {}
  buzz(6); vswap = true; keepDays = true;
  try { render(); } finally { vswap = false; }
  say(on ? "Solo da decidere: cambi, capitano e avvisi" : "Squadra completa");
  document.querySelector("#v-form [data-decide]")?.focus({preventScroll: true});
}
// Da fare ora: cambi, capitano, titolari e notizie, nell'ordine in cui vanno fatti. Con dec (solo da decidere):
// solo cambi, capitano, avvisi e il pulsante Condividi
function todoCard(dec) {
  const i = activeIdx(), g = D.piano.giornate[i], t = today();
  if (g.dal <= t) return "";   // giornata iniziata: c'è la scheda in diretta
  const items = [], A = D.app && D.app.attuale ? D.app.attuale : null;
  const mineNames = new Set(A ? A.map(p => p.nome) : D.rosa);
  const inn = g.giocatori.filter(p => !mineNames.has(p.nome)), out = A ? A.filter(p => !g.giocatori.some(q => q.nome === p.nome)) : [];
  const when = `${dow(g.dal)} ${dmy(g.dal)}`;
  const it = (cls, t, d = "", extra = "") => `<li class="${cls}" style="--k:${items.length}"><div class="body"><div class="t">${t}</div>${d ? `<div class="d">${d}</div>` : ""}${extra}</div></li>`;
  if (inn.length) items.push(it("", `Fai ${inn.length} ${inn.length === 1 ? "cambio" : "cambi"} prima di ${when}`,
    g.malus ? `Malus −${num(g.malus, 0)}` : g.label === "G1" ? "Senza malus" : "",
    `<div class="mv">${out.length ? `<span class="lab">Fuori</span><div class="chips">${out.map((p, k) => `<span class="chip o" style="--k:${k}">${esc(surname(p.nome))}</span>`).join("")}</div>` : ""}
      <span class="lab">Dentro</span><div class="chips">${inn.map((p, k) => `<span class="chip i" style="--k:${k + out.length}">${esc(surname(p.nome))}</span>`).join("")}</div></div>`));
  else items.push(it("ok", `Nessun cambio prima della ${esc(g.label)}`, "La rosa va bene così."));
  const c = g.capitano[0], cp = c && g.giocatori.find(p => p.id === c.id);
  if (cp) {
    const now = A && A.find(p => p.capitano);
    items.push(it(now && now.nome === cp.nome ? "ok" : "", `Capitano: ${esc(cp.nome)} <span class="muted">(T${c.turno})</span>`,
      `${now ? now.nome === cp.nome ? "Ha già la fascia." : `Ora la fascia ce l'ha ${esc(now.nome)}.` : ""}${c.soglia != null ? ` Se fa meno di ${c.soglia} punti la fascia passa al prossimo.` : ""}`));
  }
  if (A && !dec) {
    const want = g.giocatori.filter(p => p.slot === "titolare").map(p => p.nome), have = new Set(A.filter(p => p.slot === "titolare").map(p => p.nome));
    const missing = want.filter(n => !have.has(n));
    if (missing.length) items.push(it("", `Quintetto del T1`, `Titolari: ${want.map(n => esc(surname(n))).join(", ")}.<br>Da mettere in quintetto: <b>${missing.map(n => esc(surname(n))).join(", ")}</b>${inn.length ? " (dopo i cambi)" : ""}.`));
  }
  const names = new Set([...g.giocatori.map(p => p.nome), ...mineNames]);
  [...names].forEach(n => {
    const info = D.giocatori[n] || {};
    const inj = info.infortunio, abs = info.assente;
    if ((inj && !/available/i.test(inj.stato)) || (abs != null && abs < 1))
      items.push(it("warn", `${esc(n)}: ${esc(inj ? inj.stato : "in dubbio")}${abs != null ? ` <span class="muted">(gioca al ${Math.round(abs * 100)}%)</span>` : ""}`,
        `${inj ? esc(inj.motivo) + " · " : ""}${g.giocatori.some(p => p.nome === n) ? "nel piano" : "nella tua rosa"}`));
  });
  const sw = `<button type="button" class="dec-t" data-decide aria-pressed="${!!dec}"><span class="dec-k" aria-hidden="true"></span>Solo da decidere</button>`;
  if (dec) return `<div class="card todo dec-c">${head(`Da fare ora`, `${esc(g.label)} · ${when}`)}${sw}<ol class="chain">${items.join("")}</ol>
    <div class="share-row"><button type="button" class="btn-o" id="share-f" data-g="${i}">${ic("share")}Condividi formazione</button></div></div>`;
  return `<div class="card todo">${head(`Da fare ora`, `${esc(g.label)} · ${when}`)}${sw}${todayCard(true)}<ol class="chain">${items.join("")}</ol></div>`;
}

// In diretta: punti veri dall'app Dunkest (alla data dell'ultimo aggiornamento) e consigli su capitano e cambi
function liveCard() {
  const A = D.app && D.app.attuale, G = D.app && D.app.giornata;
  if (!A || !G) return "";
  const i = D.piano.giornate.findIndex(g => g.label === `G${G.number}`);
  const plan = i >= 0 ? (hasMine() ? D.piano.attuale[i] : D.piano.giornate[i]) : null, t = today();
  const started = A.some(p => p.giocata) || (plan && plan.dal <= t && t <= plan.al);
  if (!started) return "";
  const exp = n => plan?.giocatori.find(p => p.nome === n);
  const turns = [...new Set(A.map(p => p.turno || 0))].sort((a, b) => (a || 9) - (b || 9));
  const W = {titolare: 1, "sesto uomo": 1, panchina: .5};
  const tot = A.reduce((s, p) => s + (p.punti || 0) * (W[p.slot] ?? 1) * (p.capitano ? 1.5 : 1), 0);
  const rows = turns.map(tn => `<div class="live-h">${tn ? `Turno ${tn}` : "Riposo"}</div>` + A.filter(p => (p.turno || 0) === tn).map(p => {
    const e = exp(p.nome);
    return `<div class="live-row"><span>${esc(p.nome)}${p.capitano ? ' <span class="badge-inline">C</span>' : ""} <small class="muted">${esc(p.slot)}</small></span>
      <span class="exp">${e ? "attesi " + num(e.punti) : ""}</span><b class="${p.giocata && e ? (p.punti >= e.punti ? "up" : "down") : ""}">${p.giocata ? num(p.punti) : "–"}</b></div>`;
  }).join("")).join("");
  const tips = [];
  if (plan) {
    const byName = Object.fromEntries(A.map(p => [p.nome, p])), nmOf = id => plan.giocatori.find(p => p.id === id)?.nome;
    for (const c of plan.capitano) {
      const n = nmOf(c.id), p = byName[n];
      if (!p) continue;
      if (!p.giocata) { tips.push(`Fascia a <b>${esc(n)}</b>: gioca nel T${c.turno}.`); break; }
      if (c.soglia == null || p.punti >= c.soglia) { tips.push(`Tieni la fascia a <b>${esc(n)}</b>: ${num(p.punti)} punti${c.soglia != null ? ` (soglia ${c.soglia})` : ""}.`); break; }
      tips.push(`${esc(n)} ha fatto ${num(p.punti)}, sotto ${c.soglia}: passa la fascia.`);
    }
    for (const s of plan.sostituzioni) {
      const st = s.titolari.map(nmOf).map(n => byName[n]).filter(p => p && p.giocata);
      if (!st.length) continue;
      const worst = st.reduce((a, b) => a.punti <= b.punti ? a : b);
      const o = s.opzioni.find(o => { const e = byName[nmOf(o.entra)]; return e && !e.giocata && worst.punti < o.soglia && o.ruoli.includes(worst.ruolo); });
      if (o) tips.push(`Dopo il T${s.dopo_turno}: togli <b>${esc(worst.nome)}</b> (${num(worst.punti)}) e metti <b>${esc(nmOf(o.entra))}</b> (T${o.turno}).`);
    }
  }
  const [dd, hh] = D.aggiornato.split(" ");
  return `<div class="card live">${head(`<span class="live-dot" aria-hidden="true"></span>In diretta · G${G.number}`, `al ${dmy(dd)} · ${hh}`)}
    <div class="kpis" style="--n:2"><div class="kpi hi"><b>${num(tot)}</b><span>punti finora</span></div><div class="kpi"><b>${A.filter(p => p.giocata).length}/${A.length}</b><span>hanno giocato</span></div></div>
    ${tips.length ? `<div class="tips"><ol>${tips.map(x => `<li><span>${x}</span></li>`).join("")}</ol></div>` : ""}
    <div class="live-t">${rows}</div>
    <p class="note">Punti dall'app Dunkest al ${dmy(dd)} alle ${hh} (stima: capitano ×1,5, panchina al 50%). Si aggiornano a ogni "Aggiorna" e nei controlli prima dei turni.</p></div>`;
}

// Ultima giornata giocata, dai dati dell'app Dunkest
function lastDay() {
  const u = D.app && D.app.ultima;
  if (!u) return "";
  const t = u.totali || {}, sq = D.app.squadra || {};
  const rows = [...u.giocatori].sort((a, b) => (a.posizione || 99) - (b.posizione || 99)).map(p => `<tr>
    <td>${esc(p.nome)}${p.capitano ? ' <span class="badge-inline">C</span>' : ""} <br><small class="muted">${esc(p.slot)}</small></td>
    <td>${num(p.punti || 0)}</td><td class="${p.variazione > 0 ? "up" : p.variazione < 0 ? "down" : ""}">${p.variazione == null ? "–" : sign(p.variazione)}</td></tr>`).join("");
  return `<div class="card">${head(`La tua G${u.numero}`, "dall'app Dunkest")}
    <div class="kpis"><div class="kpi hi"><b>${num(t.pts || 0)}</b><span>punti</span></div>
      <div class="kpi"><b>${sign(t.plus || 0)}</b><span>plusvalenza</span></div>
      <div class="kpi"><b>${sq.position ? sq.position + "°" : "–"}</b><span>classifica</span></div>
      <div class="kpi"><b>${num(sq.total_pts || 0)}</b><span>punti totali</span></div></div>
    <div class="scroll"><table class="lastday"><thead><tr><th>Giocatore</th><th>Punti</th><th>Prezzo</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// Quanto sbaglia il modello: registro di questa stagione (previsti vs veri)
function accuracy() {
  const r = D.registro;
  if (!r || !r.partite) return `<div class="card">${head("Precisione delle previsioni", "in attesa")}
    <div class="empty">${ICON.wait}<b>Si riempie dopo le prime partite</b>Dal 20 ottobre ogni previsione della giornata viene confrontata con i punti veri della regular season e il modello si ritara da solo.</div></div>`;
  return `<div class="card">${head("Precisione delle previsioni")}
    <div class="kpis" style="--n:3"><div class="kpi"><b>${num(r.MAE)}</b><span>errore medio (punti)</span></div>
      <div class="kpi"><b>${sign(r.bias)}</b><span>distorsione</span></div>
      <div class="kpi"><b>${r.partite}</b><span>partite</span></div></div>
    <p class="note">Partita per partita, sui giocatori scesi in campo. Il modello si ritara da solo su questi dati.</p></div>`;
}

// Prova sulla carta contro le quote (nessun soldo vero)
function paperBets() {
  const r = D.schedine;
  if (!r || !r.giocate) return `<div class="card">${head("Prova schedine", "sulla carta")}
    <div class="empty">${ICON.ticket}<b>Nessuna giocata ancora</b>Nessun soldo vero. Dal 20 ottobre, ogni mattina il modello confronta le sue previsioni (fatte senza guardare le quote) con le soglie DraftKings e registra 1 unità finta quando vede almeno il 5% di valore; dopo le partite le giocate si chiudono con i risultati veri. Servono alcune centinaia di giocate per capire se c'è un vantaggio reale.</div></div>`;
  const pct = v => v == null ? "–" : (v > 0 ? "+" : "") + (v * 100).toLocaleString("it-IT", {maximumFractionDigits: 1}) + "%";
  const last = (r.ultime || []).slice(-6).reverse().map(g => `<tr><td>${esc(g.GIOCATORE || g.SQUADRA)}<br><small class="muted">${esc(g.MERCATO)} · ${esc(g.DATA)}</small></td>
    <td>${num(g.QUOTA, 2)}</td><td>${esc(g.ESITO)}</td></tr>`).join("");
  const sure = r.chiuse >= 300 ? "" : ` Con ${r.chiuse || 0} giocate chiuse il risultato è ancora soprattutto fortuna: servono alcune centinaia di giocate.`;
  return `<div class="card">${head("Prova schedine", "sulla carta")}
    <div class="kpis"><div class="kpi ${r.unita > 0 ? "hi" : ""}"><b>${r.unita == null ? "–" : sign(r.unita, 2)}</b><span>unità</span></div>
      <div class="kpi"><b>${pct(r.rendimento)}</b><span>rendimento${r.incertezza != null ? " ± " + pct(r.incertezza).replace("+", "") : ""}</span></div>
      <div class="kpi"><b>${r.vinte ?? 0}/${r.chiuse || 0}</b><span>vinte</span></div>
      <div class="kpi"><b>${r.aperte}</b><span>aperte</span></div></div>
    ${last ? `<div class="scroll"><table class="lastday"><thead><tr><th>Giocata</th><th>Quota</th><th>Esito</th></tr></thead><tbody>${last}</tbody></table></div>` : ""}
    <p class="note">Nessun soldo vero: 1 unità finta per ogni giocata in cui il modello, senza guardare le quote, vede almeno il 5% di valore.${sure}</p></div>`;
}

// Modello contro FantasyPros ed ESPN (minuti e punti Dunkest a partita, senza avversario)
function sourcesBlock(c) {
  if (!c) return "";
  // barra sotto ai punti, in scala da zero sul più alto: si riempiono una dopo l'altra quando apri i dettagli
  const mx = Math.max(1, ...[c.modello, c.FantasyPros, c.ESPN, c.BR].filter(x => x && x.punti > 0).map(x => x.punti));
  let k = 0;
  const bar = (x, me) => x && x.punti != null ? `<span class="sb${me ? " me" : ""}" aria-hidden="true"><i style="--w:${(Math.max(0, x.punti) / mx * 100).toFixed(1)}%;--k:${k++}"></i></span>` : "";
  const row = (lab, x, me) => x ? `<tr data-tip="${lab}: ${num(x.punti)} punti a partita, ${num(x.min)} minuti"><td>${lab}</td><td>${num(x.min)}</td><td>${num(x.punti)}${bar(x, me)}</td></tr>` : "";
  return `<details${c.disaccordo ? " open" : ""}><summary><span>Altre fonti${c.disaccordo ? " · <b>il modello non è d'accordo</b>" : ""}</span></summary>
    <table class="lastday"><thead><tr><th>Fonte</th><th>Minuti</th><th>Punti</th></tr></thead><tbody>
    ${row("Modello", c.modello, true)}${row("FantasyPros", c.FantasyPros)}${row("ESPN", c.ESPN)}${c.BR ? `<tr data-tip="Basketball-Reference: ${num(c.BR.punti)} punti a partita"><td>Basketball-Reference</td><td class="muted">(minuti nostri)</td><td>${num(c.BR.punti)}${bar(c.BR)}</td></tr>` : ""}</tbody></table>
    <p class="note">Barra piena arancio: il modello; a righe grigie: le altre fonti. Punti Dunkest a partita senza avversario. Nel piano FantasyPros pesa il 60% a inizio stagione, il 20% fino a 9 partite, poi 0 (tarato sul 2025-26).</p></details>`;
}

function disagreements() {
  const c = D.confronto || [];
  if (!c.length) return "";
  const L = c.slice(0, 15), rows = moreRows(L.map(x => `<tr><td>${esc(x.nome)}<br><small class="muted">${esc(x.squadra)} · ${cr(x.crediti)}${x.mio ? ` · <b style="color:var(--accent-text)">in rosa/piano</b>` : ""}</small></td>
    <td>${num(x.modello.min, 0)} / ${num(x.modello.punti, 0)}</td>
    <td>${x.FantasyPros ? num(x.FantasyPros.min, 0) + " / " + num(x.FantasyPros.punti, 0) : "–"}</td>
    <td>${x.ESPN ? num(x.ESPN.min, 0) + " / " + num(x.ESPN.punti, 0) : "–"}</td>
    <td>${x.BR ? num(x.BR.punti, 0) : "–"}</td></tr>`));
  return `<div class="card">${head("Dove il modello non è d'accordo", "min / punti")}
    <p class="note">Minuti / punti a partita. Prima i giocatori della tua rosa e del piano, poi i disaccordi più grandi: sono i casi da controllare (spesso il modello conosce un infortunio o un cambio di ruolo).</p>
    <div class="scroll"><table class="lastday"><thead><tr><th>Giocatore</th><th>Modello</th><th>FP</th><th>ESPN</th><th>BR</th></tr></thead><tbody>${rows}</tbody></table></div>${moreBtn(L.length)}</div>`;
}

// Stato delle fonti: da quanto tempo ogni origine dati non si aggiorna. Riassunto in una riga, poi una griglia
// compatta di tessere (prima quelle da controllare); pallino pieno = fresca, anello rosso = vecchia.
function sourcesCard() {
  const F = D.fonti || [];
  if (!F.length) return "";
  const bad = F.filter(f => !f.ok).length;
  const age = h => h == null || !isFinite(h) ? "mai scaricata" : h < 1 ? "meno di un'ora fa" : h < 48 ? `${Math.round(h)} ore fa` : `${Math.round(h / 24)} giorni fa`;
  const short = h => h == null ? "mai" : h < 1 ? "< 1 h" : h < 48 ? `${Math.round(h)} h` : `${Math.round(h / 24)} g`;
  const oldest = Math.max(...F.map(f => f.ore == null ? Infinity : f.ore));
  const L = [...F].sort((x, y) => x.ok - y.ok);
  const li = (f, k) => `<li class="${f.ok ? "" : "bad"}" style="--k:${k}"><span class="src-dot" aria-hidden="true"></span><span>${esc(f.nome)}</span><small class="num" aria-label="${age(f.ore)}${f.ok ? "" : ", da controllare"}">${short(f.ore)}</small></li>`;
  return `<div class="card">${head("Stato delle fonti", bad ? `<span style="color:var(--bad)">${bad} da controllare</span>` : "tutte fresche")}
    <div class="src-sum${bad ? " bad" : ""}"><span class="src-dot" aria-hidden="true"></span><b>${F.length - bad}/${F.length}</b><span>aggiornate · ${isFinite(oldest) ? `la più vecchia ${age(oldest)}` : "una non è mai stata scaricata"}</span></div>
    ${L.some(f => !f.ok) ? `<ul class="src-grid">${L.filter(f => !f.ok).map(li).join("")}</ul>` : ""}
    ${bad < F.length ? `<details><summary><span>${bad ? `Le altre ${F.length - bad} fonti, fresche` : `Vedi le ${F.length} fonti`}</span></summary><ul class="src-grid">${L.filter(f => f.ok).map(li).join("")}</ul></details>` : ""}
    <p class="note">Dalla prima partita il limite è 36 ore, prima 7 giorni. Una fonte vecchia vuol dire che il modello lavora su dati non aggiornati.</p></div>`;
}

// Cambi di squadra: chi tira di più, chi meno, e cosa cambia per i compagni. Una sola scheda: in testa la sintesi,
// il metodo dietro "Come si misura", poi tre schede interne (più usati, tua rosa, squadre a barre).
let modTab = "movers";
function swapsCard() {
  const S = D.scambi;
  if (!S) return "";
  const m = S.misura, mine = new Set(D.rosa || []);
  const fx = v => v > 0.05 ? "up" : v < -0.05 ? "down" : "";
  const mv = S.cambiati.map(x => `<tr><td>${esc(x.nome)}${mine.has(x.nome) ? ' <span class="pill mine-tag">tua</span>' : ""}<br><small class="muted">${esc(x.da)} → ${esc(x.a)} · ${cr(x.crediti)} cr</small></td>
    <td>${num(x.usage36, 0)}</td><td>${num(x.ppg, 0)}</td><td class="${fx(x.dfp)}">${sign(x.dfp, 1)}</td></tr>`);
  const movers = mv.length ? `<div class="scroll"><table class="lastday"><thead><tr><th>Giocatore</th><th>Azioni</th><th>Pt</th><th>Eff.</th></tr></thead><tbody>${moreRows(mv)}</tbody></table></div>${moreBtn(mv.length)}
    <p class="note">Azioni ogni 36 minuti e punti a partita. Eff. = punti Dunkest a partita in più o in meno per i compagni nuovi (stima).</p>` : "";
  const my = S.tutti.filter(x => mine.has(x.nome)).sort((a, b) => a.dfp - b.dfp);
  const myR = my.map(x => `<tr><td>${esc(x.nome)}<br><small class="muted">${esc(x.da)}${x.da !== x.a ? " → " + esc(x.a) : ""}</small></td><td class="${x.dusage36 > 0 ? "up" : "down"}">${sign(x.dusage36, 1)}</td><td class="${fx(x.dfp)}">${sign(x.dfp, 1)}</td></tr>`);
  const mineH = myR.length ? `<div class="scroll"><table class="lastday"><thead><tr><th>Giocatore</th><th>Δ azioni/36</th><th>Δ pt</th></tr></thead><tbody>${moreRows(myR)}</tbody></table></div>${moreBtn(myR.length)}
    <p class="note">Quanto cambiano azioni e punti Dunkest a partita dei tuoi giocatori per i compagni nuovi.</p>` : "";
  const T = S.squadre || [], lose = T.filter(t => t.netto < 0).slice(0, 7), gain = T.filter(t => t.netto > 0).slice(-7).reverse();
  const mx = Math.max(1, ...[...lose, ...gain].map(t => Math.abs(t.netto)));
  const who = L => L.map(x => esc(surname(x.nome))).join(", ");
  const tm = (t, k) => `<li class="tm" style="--k:${k}"><b class="tm-c" style="--tc:${teamTone(t.squadra)}">${esc(t.squadra)}</b>
    <span class="tm-bar" aria-hidden="true"><i class="${t.netto > 0 ? "p" : "n"}" style="--w:${(Math.abs(t.netto) / mx * 100).toFixed(1)}%"></i></span><b class="tm-v ${t.netto > 0 ? "up" : "down"}">${sign(t.netto, 0)}</b>
    <small class="tm-who">${t.partiti.length ? `<em>Escono</em> ${who(t.partiti)}` : ""}${t.partiti.length && t.arrivati.length ? " · " : ""}${t.arrivati.length ? `<em>Entrano</em> ${who(t.arrivati)}` : ""}</small></li>`;
  const teams = lose.length || gain.length ? `${lose.length ? `<div class="tm-g">Perdono più azioni</div><ul class="tm-l">${lose.map(tm).join("")}</ul>` : ""}
    ${gain.length ? `<div class="tm-g">Ne guadagnano di più</div><ul class="tm-l">${gain.map((t, k) => tm(t, k + lose.length)).join("")}</ul>` : ""}
    <p class="note">Saldo = azioni a partita degli arrivati meno quelle dei partiti. Una squadra con saldo alto ha più giocatori che si contendono i tiri.</p>` : "";
  const tabs = [["movers", "Più usati", movers], ["mine", "Tua rosa", mineH], ["teams", "Squadre", teams]].filter(t => t[2]);
  if (!tabs.length) return "";
  if (!tabs.some(t => t[0] === modTab)) modTab = tabs[0][0];
  const ti = tabs.findIndex(t => t[0] === modTab);
  return `<div class="card">${head("Chi cambia squadra", `${m.cambiati} su ${m.giocatori}`)}
    <p class="note">Su ${m.transizioni} cambi di squadra passati: più azioni dei compagni nuovi vogliono dire meno tiri per te (effetto solido), ma sui punti Dunkest l'effetto è piccolo e incerto. Qui è informativo: <b style="color:var(--fg)">non cambia le proiezioni</b>.</p>
    <details><summary><span>Come si misura</span></summary><p class="note">Misura: quante azioni chiude un giocatore (tiri + 0,44 liberi + palle perse) ogni 36 minuti, dati 2025-26. Sulle ${m.transizioni} stagioni passate (2022-23 → 2025-26): per ogni azione ogni 36 minuti in più dei compagni, un giocatore ne chiude in media <b>${num(Math.abs(m.dusage_per_dC), 1)}</b> in meno (t ${num(m.t_usage, 1)}, effetto solido). Sui punti Dunkest invece l'effetto è piccolo e incerto (circa ${num(Math.abs(m.dfp_per_dC) * 30 / 36, 1)} punti a partita per azione, t ${num(m.t_fp, 1)}): perdi tiri ma anche palle perse e tiri sbagliati. Il test sul 2025-26 non lo trova negli errori del modello, quindi qui è informativo e non cambia le proiezioni.</p></details>
    <div class="tabs" role="tablist" aria-label="Chi cambia squadra" style="--n:${tabs.length};--t:${ti}">${tabs.map(([k, l]) => `<button type="button" role="tab" id="tab-${k}" aria-controls="pan-${k}" aria-selected="${k === modTab}" tabindex="${k === modTab ? 0 : -1}" data-tab="${k}">${l}</button>`).join("")}<i aria-hidden="true"></i></div>
    ${tabs.map(([k, , h]) => `<div class="tabpan" role="tabpanel" id="pan-${k}" aria-labelledby="tab-${k}"${k === modTab ? "" : " hidden"}>${h}</div>`).join("")}</div>`;
}

// Vista Modello: precisione, prova schedine, test sulle stagioni passate

    const str = s.righe.map(r => `<tr><td>${esc(r.strategia)}</td><td>${r.punti.toLocaleString("it-IT")}</td><td>${r.cambi}</td><td>${num(r.valore)}</td></tr>`).join("");
    tests = `<div class="card">${head("Test sulle stagioni passate")}
      <div class="kpis" style="--n:3"><div class="kpi"><b>${num(p.mae_prima, 2)}</b><span>errore prima</span></div>

      <p class="note">${esc(s.note)}</p></div>`;
  }
  const parts = [["m-fonti", "Fonti", sourcesCard()], ["m-scambi", "Cambi di squadra", swapsCard()], ["m-prec", "Precisione", accuracy()], ["m-stag", "Stagione", seasonCard()],
    ["m-sched", "Schedine", paperBets()], ["m-conf", "Altre fonti", disagreements()], ["m-test", "Test", tests],
    ["m-guida", "Guida", `<div class="card">${head("Guida rapida", "3 schermate")}<p class="note">Squadra, Opzioni e Mercato spiegati in breve, come al primo avvio.</p><button type="button" class="btn-o" data-tour style="justify-self:start">${ic("form")}Rivedi la guida</button></div>`]].filter(x => x[2]);
  const el = document.getElementById("v-mod"), F = D.fonti || [], fOk = F.filter(f => f.ok).length, r = D.registro;
  const kp = [F.length ? [`${fOk}/${F.length}`, "fonti fresche", fOk === F.length] : null,
    t ? [num(t.previsioni.mae_dopo, 2), "errore del test", false] : null,
    [r && r.partite ? String(r.partite) : "0", "partite nel registro", false],
    D.scambi ? [String(D.scambi.misura.cambiati), "cambiano squadra", false] : null].filter(Boolean);

    <div class="kpis board" style="--n:${kp.length}">${kp.map(([v, l, hi]) => `<div class="kpi${hi ? " hi" : ""}"><b>${esc(v)}</b><span>${l}</span></div>`).join("")}</div>
    <nav class="jump" aria-label="Sezioni del modello">${parts.map(([id, l], k) => `<a href="#${id}" data-jump="${id}"${k ? "" : ' aria-current="true"'}>${l}</a>`).join("")}</nav>
    ${parts.map(([id, , h]) => `<div class="msec" id="${id}">${h}</div>`).join("")}`;
  watchSections(el);
}

// Indice della vista Modello: si accende la sezione che stai leggendo
let secObs = null;
function watchSections(el) {
  if (secObs) secObs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const nav = el.querySelector(".jump");
  secObs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    nav.querySelectorAll("a").forEach(a => a.dataset.jump === e.target.id ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"));
    const a = nav.querySelector("[aria-current]");
    if (a) nav.scrollTo({left: a.offsetLeft - 16, behavior: calm ? "auto" : "smooth"});
  }), {rootMargin: "-30% 0px -65% 0px"});
  el.querySelectorAll(".msec").forEach(s => secObs.observe(s));
}

// La stagione passata giocata dal modello completo: barre in scala con i punti
function seasonCard() {
  const c = D.test && D.test.stagione_completa;
  if (!c) return "";
  const mx = Math.max(...c.righe.map(r => r.punti)), best = Math.max(...c.righe.slice(0, -1).map(r => r.punti));
  const rows = c.righe.map((r, k) => `<div class="sc-row${k === c.righe.length - 1 ? " ghost" : r.punti === best ? " best" : ""}">
    <div class="sc-h"><span>${esc(r.strategia)}</span><b>${r.punti.toLocaleString("it-IT")}</b></div>
    <div class="sc-bar"><i style="--w:${(r.punti / mx * 100).toFixed(1)}%;--b:${k}"></i></div>
    <small class="muted">${num(r.punti / r.giornate, 0)} a giornata · ${r.cambi} cambi · valore rosa ${num(r.valore)}</small></div>`).join("");
  return `<div class="card">${head(`La stagione ${esc(c.stagione)} giocata dal modello`)}<div class="sc">${rows}</div><p class="note">${esc(c.note)}</p></div>`;
}

// Cambi di rosa consigliati per la giornata (la formazione la decidi tu turno per turno)
function diffCard(g) {
  if (!D.app || !D.app.attuale) return "";
  const mine = new Set(D.app.attuale.map(p => p.nome));
  const inn = g.giocatori.filter(p => !mine.has(p.nome)).map(p => p.nome);
  if (!inn.length) return "";
  const outP = D.app.attuale.filter(p => !g.giocatori.some(q => q.nome === p.nome));
  const inP = g.giocatori.filter(p => !mine.has(p.nome));
  const sum = a => a.reduce((s, p) => s + (p.crediti || 0), 0);
  return `<div class="card">${head(`Cambi di rosa per la ${esc(g.label)}`, g.malus ? `malus −${num(g.malus, 0)}` : "")}
    <div class="swap-h"><span class="lab">Escono</span><span></span><span class="lab">Entrano</span></div>
    ${swapList(outP.map(p => [p.nome, cr(p.crediti)]), inP.map(p => [p.nome, cr(p.crediti)]))}
    <div class="swap-sum"><span>Escono <b>${cr(sum(outP))}</b> cr</span><span>Entrano <b>${cr(sum(inP))}</b> cr</span></div>
    <p class="note">${g.malus ? `Malus −${num(g.malus, 0)}. ` : ""}La formazione la scegli tu turno per turno: prima di ogni turno ti dico chi cambiare in base ai punti già fatti.</p></div>`;
}

function priceRows(names) {
  const snaps = D.fotografie;
  return names.map(n => {
    const pr = D.giocatori[n]?.prezzi || {};
    const vals = snaps.map(s => pr[s]);
    const first = vals.find(v => v != null), last = [...vals].reverse().find(v => v != null);
    return {n, vals, d: first != null && last != null ? last - first : null};
  });
}

function renderPrezzi() {
  const snaps = D.fotografie;
  const rows = priceRows(D.rosa);
  const tot = snaps.map((_, i) => rows.reduce((s, r) => s + (r.vals[i] ?? 0), 0));
  let chart = `<div class="empty"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 34h30"/><path d="M7 26l8-7 7 5 11-12" stroke-dasharray="3 4"/></svg><b>Una sola fotografia: ${esc(snaps[0] || "G1")}</b>Le variazioni reali arrivano quando l'app aggiorna i prezzi dopo la prima giornata giocata.</div>`;

    const X = i => pl + 14 + i * (W - pl - pr - 28) / (snaps.length - 1), Y = v => base - (v - mn) / (mx - mn) * (base - top);

    // asse: base piena, due righe tratteggiate leggere, valori a sinistra fuori dal disegno

    const lx = X(tot.length - 1), anchor = snaps.length > 1 ? "end" : "middle";

      <polygon class="ar" points="${X(0).toFixed(1)},${base} ${pts} ${lx.toFixed(1)},${base}" fill="url(#${gid})"/>
      <polyline class="ln" pathLength="1" points="${pts}" fill="none" stroke="var(--c-hi)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${tot.map((v, i) => `<circle class="pt" data-k="${i}" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i === tot.length - 1 ? 5 : 3}" fill="${i === tot.length - 1 ? "var(--c-hi)" : "var(--surface)"}" stroke="var(--c-hi)" stroke-width="2"/>
      <circle class="hit" data-hl="${i}" data-tip="${esc(snaps[i])}: ${num(v)} crediti" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="16" fill="transparent"/>
      <text x="${X(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="11"${i === tot.length - 1 ? ` font-weight="700" fill="var(--fg)"` : ` fill="var(--muted)"`}>${esc(snaps[i])}</text>`).join("")}
      <text class="pt" x="${lx.toFixed(1)}" y="${(tot.at(-1) < tot.at(-2) ? Math.min(Y(tot.at(-1)) + 22, base - 5) : Y(tot.at(-1)) - 11).toFixed(1)}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="var(--fg)">${num(tot.at(-1))} cr</text></svg></div>`;
  }
  const t = D.taratura;
  const src = t ? Object.entries(t.stagioni || {}).map(([k, v]) => `${k}: ${v} giornate`).join(", ") : "";
  const calib = t ? `<p>${t.campioni.toLocaleString("it-IT")} variazioni reali (${esc(src)}), precisione R² ${num(t.r2, 2)}. ${t.campioni >= 150 && t.b > 0 ? "<b>In uso</b> per le plusvalenze attese." : "Non ancora in uso: servono almeno 150 esempi."}</p>
    ${t.b > 0 ? `<div><div class="lab" style="margin-bottom:6px">Punti per non perdere valore</div><div class="chips">${[5, 10, 15, 20].map(p => `<span class="chip num">${p} cr → <b>${num(-(t.a + t.c * p) / t.b)}</b></span>`).join("")}</div></div>` : ""}`
    : `<p class="muted">Partirà da sola dopo la prima giornata con le variazioni reali: oggi le plusvalenze attese sono una stima.</p>`;
  document.getElementById("v-prezzi").innerHTML = `${vhead("prezzi", "Prezzi", "Valore della tua rosa giornata per giornata e regola delle plusvalenze.")}
    <div class="kpis board"><div class="kpi hi"><b>${num(tot.at(-1))}</b><span>valore rosa</span></div>
      <div class="kpi"><b>${snaps.length > 1 ? sign(tot.at(-1) - tot[0]) : "–"}</b><span>dalla ${esc(snaps[0] || "G1")}</span></div>

      <tbody>${rows.sort((a, b) => (b.d ?? 0) - (a.d ?? 0) || (b.vals.at(-1) ?? 0) - (a.vals.at(-1) ?? 0)).map(r => `<tr><td>${esc(r.n)}</td>${r.vals.map((v, i) => `<td${i === r.vals.length - 1 ? ' class="cur"' : ""}>${v == null ? "–" : cr(v)}</td>`).join("")}

// Opzioni: formazioni alternative per il prossimo turno, da confrontare.
// In testa un confronto a colpo d'occhio: differenza di punti attesi rispetto alla consigliata, in scala, con la
// fascia di rumore (±1,5 punti) in grigio; tocca una riga per andare alla sua scheda.
const ALT_NOISE = 1.5;
const itNum = t => esc(t).replace(/(^|[^\d.])-(?=\d)/g, "$1−").replace(/(\d)\.(\d{1,2})(?!\d)/g, "$1,$2");   // testi del piano: virgola decimale e segno meno tipografico
function renderAlt() {
  const A = D.alternative, el = document.getElementById("v-alt");
  const vh = vhead("alt", "Opzioni", "Formazioni alternative per la prossima giornata, messe a confronto.");
  if (!A || !A.opzioni || !A.opzioni.length) { el.innerHTML = `${vh}<div class="empty">${ILL.alt}<b>Nessuna alternativa calcolata</b><span>Chiedi a Claude di prepararle: qui le vedrai confrontate con il piano, una accanto all'altra.</span></div>`; return; }
  const O = A.opzioni, rec = O.find(o => o.tag === "consigliata") || O[0];
  const age = Math.floor((Date.now() - new Date(A.calcolato + "T12:00:00")) / 864e5);
  const dl = o => o.punti - rec.punti;
  const span = Math.ceil(Math.max(ALT_NOISE * 2, ...O.map(o => Math.abs(dl(o)))));
  const pos = v => (50 + v / span * 48).toFixed(1);
  const cls = d => d > ALT_NOISE ? "up" : d < -ALT_NOISE ? "down" : "";
  const tag = o => o.tag === "consigliata" ? '<span class="pill mine-tag">consigliata</span>' : o.tag === "scartata" ? '<span class="pill out">sconsigliata</span>' : o.tag === "prudente" ? '<span class="pill q">piano B</span>' : o.tag === "riserva" ? '<span class="pill q">riserva</span>' : "";
  const cambi = n => `${n} ${n === 1 ? "cambio" : "cambi"}`;
  const rows = O.map((o, k) => {
    const d = dl(o), isRec = o === rec, bar = isRec ? `<em style="left:50%"></em>`
      : `<i class="${Math.abs(d) <= ALT_NOISE ? "z" : d > 0 ? "p" : "n"}" style="left:${pos(Math.min(0, d))}%;right:${(100 - pos(Math.max(0, d))).toFixed(1)}%;transform-origin:${d >= 0 ? "left" : "right"}"></i>`;
    return `<button type="button" class="cmp-row${isRec ? " rec" : ""}" data-alt="${o.id}" style="--k:${k}" aria-label="${esc(o.nome)}: ${num(o.punti)} punti attesi${isRec ? ", riferimento" : `, ${sign(d)} sulla consigliata`}, ${cambi(o.fuori.length)}. Vai alla scheda">
      <span class="alt-n">${o.id}</span>
      <span class="cmp-name"><b>${esc(o.nome)}</b><small>${cambi(o.fuori.length)}${o.prezzi != null ? ` · ${sign(o.prezzi, 2)} cr` : ""}</small></span>
      <span class="cmp-v"><b>${num(o.punti)}</b><small class="${isRec ? "" : cls(d)}">${isRec ? "riferimento" : sign(d)}</small></span>
      <span class="cmp-bar" aria-hidden="true"><span class="cmp-noise" style="left:${pos(-ALT_NOISE)}%;right:${(100 - pos(ALT_NOISE)).toFixed(1)}%"></span><span class="cmp-zero"></span>${bar}</span></button>`;
  }).join("");
  const cards = O.map((o, k) => {
    const d = dl(o), isRec = o === rec;
    return `<article class="alt${isRec ? " rec" : ""}" id="alt-${o.id}" style="--k:${k}">
    <div class="alt-h"><span class="alt-n">${o.id}</span><b>${esc(o.nome)}</b>${tag(o)}${isRec ? "" : `<span class="alt-d ${cls(d)}" title="Rispetto alla consigliata">${sign(d)} pt</span>`}</div>
    <div class="alt-k"><span><b>${num(o.punti)}</b><small>punti attesi</small></span>${o.prezzi != null ? `<span class="${o.prezzi > 0 ? "up" : "down"}"><b>${sign(o.prezzi, 2)}</b><small>cr attesi</small></span>` : ""}<span><b>${o.fuori.length}</b><small>cambi</small></span>${o.tag === "riserva" && o.cambi_in_piu ? `<span><b>${sign(o.cambi_in_piu, 0)}</b><small>cambi in più</small></span>` : ""}</div>
    <p>${itNum(o.idea)} Capitano: <b>${esc(o.capitano)}</b>.</p>
    ${o.tag === "riserva" ? `<p class="alt-rs">Al posto di <b>${esc(surname(o.riserva_di))}</b>: ${o.al_posto.length ? o.al_posto.map(n => `<b>${esc(surname(n))}</b>`).join(", ") : "nessuno"}${o.esce_dalla_consigliata.length > 1 ? ` <span>(rispetto alla consigliata escono ${o.esce_dalla_consigliata.map(n => esc(surname(n))).join(", ")})</span>` : ""}.</p>` : ""}
    ${o.fuori.length ? `<div class="mv" aria-label="Cambi"><span class="lab">Fuori</span><div class="chips">${o.fuori.map((n, j) => `<span class="chip o" style="--k:${j}">${esc(surname(n))}</span>`).join("")}</div>
      <span class="lab">Dentro</span><div class="chips">${o.dentro.map((n, j) => `<span class="chip i" style="--k:${j + o.fuori.length}">${esc(surname(n))}</span>`).join("")}</div></div>` : ""}
    ${o.pro || o.contro ? `<dl class="pc-l">${o.pro ? `<div><dt class="up">Pro</dt><dd>${itNum(o.pro)}</dd></div>` : ""}${o.contro ? `<div><dt class="down">Contro</dt><dd>${itNum(o.contro)}</dd></div>` : ""}</dl>` : ""}
    ${o.rosa ? `<details class="alt-ro"><summary>Rosa completa</summary>${["titolare", "sesto uomo", "panchina", "coach"].map(sl => { const L = o.rosa.filter(g => g.slot === sl); return L.length ? `<div class="alt-sl"><small>${sl === "titolare" ? "Quintetto" : sl === "sesto uomo" ? "Sesto uomo" : sl === "panchina" ? "Panchina" : "Coach"}</small>${L.map(g => `<span class="${o.fuori.length && o.dentro.includes(g.nome) ? "new" : ""}">${esc(g.ruolo)} ${esc(surname(g.nome))} <i>${esc(g.squadra)} · ${cr(g.crediti)}</i></span>`).join("")}</div>` : ""; }).join("")}</details>` : ""}
    </article>`;
  }).join("");
  const pair = O.length > 1 && O.filter(o => o.rosa && o.rosa.length).length > 1 ? `<div class="card pair">${head("Confronto a due colonne", "per slot e ruolo")}
      <div class="pair-pick"><label><span class="lab">Colonna A</span><select id="pa">${O.filter(o => o.rosa).map(o => `<option value="${o.id}">${o.id} · ${esc(o.nome)}</option>`).join("")}</select></label>
        <button type="button" class="pair-sw" id="psw" aria-label="Scambia le colonne"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></button>
        <label><span class="lab">Colonna B</span><select id="pb">${O.filter(o => o.rosa).map(o => `<option value="${o.id}">${o.id} · ${esc(o.nome)}</option>`).join("")}</select></label></div>
      <div id="pair-b"></div>
      <p class="legend"><span><i class="lg-out"></i>esce passando da A a B</span><span><i class="lg-in"></i>entra</span><span><i class="lg-mv"></i>in tutte e due, in un altro slot</span></p></div>` : "";
  el.innerHTML = `${vh}
    <div class="card">${head("Formazioni alternative", esc(A.giornata))}
      <div class="cmp-list">${rows}</div>
      <div class="cmp-scale" aria-hidden="true"><span><span>−${span}</span><span>consigliata</span><span>+${span}</span></span></div>
      <p class="legend"><span><i style="background:var(--noise);border-color:transparent"></i>±${num(ALT_NOISE)} punti: differenza di rumore</span></p>
      <p class="note">${esc(A.nota)}</p>
      ${age > 2 ? `<p class="note" style="color:var(--warn-text)">Calcolate il ${esc(A.calcolato.split("-").reverse().join("/"))}: potrebbero non essere più aggiornate.</p>` : ""}</div>
    ${pair}
    <div class="alt-list">${cards}</div>`;
  if (pair) drawPair(false);
}

// Confronto a due colonne: per ogni slot (quintetto, sesto uomo, panchina, coach) chi c'è nell'opzione A e chi nella B.
// Stesso giocatore sulla stessa riga; poi le coppie per ruolo. Rosso = esce passando da A a B, verde = entra.
let pairA = null, pairB = null;
const SLOTS = [["titolare", "Quintetto"], ["sesto uomo", "Sesto uomo"], ["panchina", "Panchina"], ["coach", "Coach"]];
function drawPair(anim) {
  const O = (D.alternative?.opzioni || []).filter(o => o.rosa && o.rosa.length), box = document.getElementById("pair-b");
  if (!box || O.length < 2) return;
  const rec = O.find(o => o.tag === "consigliata") || O[0];
  if (!O.some(o => o.id === pairA)) pairA = rec.id;
  if (!O.some(o => o.id === pairB) || pairB === pairA) pairB = O.find(o => o.id !== pairA).id;
  document.getElementById("pa").value = pairA; document.getElementById("pb").value = pairB;
  const A = O.find(o => o.id === pairA), B = O.find(o => o.id === pairB);
  const nA = new Map(A.rosa.map(g => [g.nome, g])), nB = new Map(B.rosa.map(g => [g.nome, g]));
  const RO = {C: 0, F: 1, G: 2, HC: 3}, srt = L => [...L].sort((x, y) => (RO[x.ruolo] ?? 4) - (RO[y.ruolo] ?? 4) || y.punti - x.punti);
  const slotName = sl => (SLOTS.find(s => s[0] === sl) || [, sl])[1].toLowerCase();
  const sum = (L, k) => L.reduce((s, g) => s + (g[k] || 0), 0);
  const cell = (g, other, side) => {
    if (!g) return `<div class="pc2 none"><span class="n"><small>nessuno</small></span></div>`;
    const o = other.get(g.nome), st = !o ? (side === "a" ? "out" : "in") : o.slot !== g.slot ? "mv" : "same";
    const what = st === "out" ? "esce" : st === "in" ? "entra" : st === "mv" ? `in ${side === "a" ? "B" : "A"}: ${slotName(o.slot)}` : "";
    return `<div class="pc2 ${st}"${what ? ` title="${esc(what)}"` : ""}><span class="r">${ROLE[g.ruolo] || esc(g.ruolo)}</span><span class="n"><b>${esc(surname(g.nome))}</b><small>${esc(g.squadra)} · ${cr(g.crediti)} cr${st === "mv" ? ` · ${esc(what)}` : ""}</small></span><span class="v">${num(g.punti)}</span>${st === "out" || st === "in" ? `<span class="sr">, ${what}</span>` : ""}</div>`;
  };
  let k = 0;
  const groups = SLOTS.map(([sl, lab]) => {
    const a = srt(A.rosa.filter(g => g.slot === sl)), b = srt(B.rosa.filter(g => g.slot === sl));
    if (!a.length && !b.length) return "";
    const pairs = [], ra = [], rb = [...b];
    a.forEach(x => { const j = rb.findIndex(y => y.nome === x.nome); if (j >= 0) pairs.push([x, rb.splice(j, 1)[0]]); else ra.push(x); });
    ra.forEach(x => { let j = rb.findIndex(y => y.ruolo === x.ruolo); if (j < 0 && rb.length) j = 0; pairs.push([x, j >= 0 ? rb.splice(j, 1)[0] : null]); });
    rb.forEach(y => pairs.push([null, y]));
    pairs.sort((p, q) => (RO[(p[0] || p[1]).ruolo] ?? 4) - (RO[(q[0] || q[1]).ruolo] ?? 4));
    const rows = pairs.map(([x, y]) => {
      const diff = x && y && x.nome !== y.nome;
      const dp = diff ? y.punti - x.punti : 0, dc = diff ? y.crediti - x.crediti : 0;
      return `<div class="pair-row" style="--k:${k++}">${cell(x, nB, "a")}${cell(y, nA, "b")}${diff ? `<div class="pair-d"><span class="${dp > 0.05 ? "up" : dp < -0.05 ? "down" : ""}">${sign(dp)} pt</span><span>${dc ? sign(dc, dc % 1 ? 1 : 0) : "0"} cr</span></div>` : ""}</div>`;
    }).join("");
    return `<div class="pair-g"><div class="pair-gh"><span>${lab}</span><span class="num">${num(sum(a, "punti"))} · ${num(sum(b, "punti"))} pt</span></div>${rows}</div>`;
  }).join("");
  const dP = B.punti - A.punti, cA = sum(A.rosa, "crediti"), cB = sum(B.rosa, "crediti"), dC = cB - cA;
  const cls = v => v > 0.05 ? "up" : v < -0.05 ? "down" : "";
  const tr = (lab, a, b, d, dcls) => `<tr><td>${lab}</td><td>${a}</td><td>${b}</td><td class="${dcls}">${d}</td></tr>`;
  const cnt = (k, v) => `<span data-cnt="${k}">${v}</span>`;   // contano dal valore di prima quando cambi opzione
  box.innerHTML = `<table class="pair-sum"><thead><tr><th><span class="sr">Voce</span></th><th>A</th><th>B</th><th>B − A</th></tr></thead><tbody>
      ${tr("Punti attesi", cnt("pa", num(A.punti)), cnt("pb", num(B.punti)), cnt("pd", sign(dP)), cls(dP))}
      ${tr("Crediti in rosa", cr(cA), cr(cB), dC ? sign(dC, dC % 1 ? 1 : 0) : "0", "")}
      ${A.prezzi != null && B.prezzi != null ? tr("Crediti attesi", cnt("pca", sign(A.prezzi, 2)), cnt("pcb", sign(B.prezzi, 2)), cnt("pcd", sign(B.prezzi - A.prezzi, 2)), cls(B.prezzi - A.prezzi)) : ""}
      ${tr("Cambi", A.fuori.length, B.fuori.length, B.fuori.length - A.fuori.length ? sign(B.fuori.length - A.fuori.length, 0) : "0", "")}</tbody></table>
    <div class="pair-cols" aria-hidden="true"><span>A · ${esc(A.nome)}</span><span>B · ${esc(B.nome)}</span></div>
    <div class="pair-list${anim && !calm ? " cascade" : ""}">${groups}</div>`;
  tickNums(box);
}
document.getElementById("v-alt").addEventListener("change", e => {
  if (e.target.id === "pa") { pairA = +e.target.value; if (pairA === pairB) pairB = null; }
  else if (e.target.id === "pb") { pairB = +e.target.value; if (pairB === pairA) pairA = null; }
  else return;
  if (pairA == null) pairA = D.alternative.opzioni.filter(o => o.rosa).find(o => o.id !== pairB).id;
  drawPair(true);
});
document.getElementById("v-alt").addEventListener("click", e => {
  if (!e.target.closest("#psw")) return;
  [pairA, pairB] = [pairB, pairA]; drawPair(true);
});

// Occasioni: giocatori economici che avranno più minuti o il posto da titolare per l'assenza di un compagno

let mktTimer = 0;
const mktRedraw = () => { if (D && view === "occ" && occMode === "mkt") renderMkt(); };
const mktSkeleton = () => `<div class="card mkt-sk" aria-busy="true" aria-label="Calcolo il mercato"><div class="sk" style="--h:22px;width:45%"></div>${Array.from({length: 7}, () => `<div class="sk-row"><span class="sk" style="--h:34px"></span><span class="sk" style="--h:34px"></span><span class="sk" style="--h:34px"></span></div>`).join("")}</div>`;
function drawMkt(anim) {

function drawCmp(anim) {
  const box = document.getElementById("mkt-cmp");

    return;
  }
  const [a, b] = C, va = rowVals(a), vb = rowVals(b);
  const hc = a.ruolo === "HC" || b.ruolo === "HC";
  const M = [["Punti attesi", va.punti, vb.punti, 1], ["Se gioca", va.se, vb.se, 1], hc ? null : ["Presenza %", va.p != null ? va.p * 100 : null, vb.p != null ? vb.p * 100 : null, 0],
    ["Crediti", a.crediti, b.crediti, 1, true], ["Pt per credito", a.crediti ? va.punti / a.crediti : null, b.crediti ? vb.punti / b.crediti : null, 2],
    ["Crediti attesi", va.plus_cr, vb.plus_cr, 2], hc ? null : ["Minuti", va.min, vb.min, 1], hc ? null : ["Punti NBA", va.pts, vb.pts, 1],
    hc ? null : ["Rimbalzi", va.reb, vb.reb, 1], hc ? null : ["Assist", va.ast, vb.ast, 1]].filter(m => m && m[1] != null && m[2] != null);
  const rows = M.map(([l, x, y, d, low], k) => {
    const g = low ? y - x : x - y, big = Math.max(Math.abs(x), Math.abs(y)), w = big ? Math.min(50, Math.abs(x - y) / big * 50) : 0;
    const fx = v => (l === "Crediti attesi" ? sign(v, d) : num(v, d));
    return `<div class="cmpp-r" style="--k:${k}"><span class="a${g > 1e-9 ? " w" : ""}" data-cnt="ca${k}">${fx(x)}</span><span class="l">${l}${low ? " ↓" : ""}</span><span class="b${g < -1e-9 ? " w" : ""}" data-cnt="cb${k}">${fx(y)}</span>
      <span class="cmpp-bar" aria-hidden="true">${w > .2 ? `<i class="${g > 0 ? "a" : "b"}" style="--w:${w.toFixed(1)}%;--k:${k}"></i>` : ""}</span></div>`;
  }).join("");
  const who = (c, v, cls) => `<button type="button" data-cmpopen="${c.id}" aria-label="Scheda di ${esc(c.nome)}">${cls === "a" ? `<b><span class="sw-a" aria-hidden="true"></span>A · ${esc(surname(c.nome))}</b>` : `<b>${esc(surname(c.nome))} · B<span class="sw-b" aria-hidden="true"></span></b>`}<small>${esc(c.squadra)} · ${ROLE[c.ruolo]} · ${v.partita ? esc(v.partita) : "non gioca"}</small></button>`;
  box.innerHTML = `<div class="card cmpp${anim && !calm ? " in" : ""}">${head("Confronto", esc(curG().label))}
    <div class="cmpp-h">${who(a, va, "a")}${who(b, vb, "b")}</div>${rows}
    <p class="note">La barra parte dal centro verso chi è meglio (↓ = meno è meglio), lunga quanto la differenza rispetto al più grande dei due. Valori della giornata scelta, con la tua stima di presenza se l'hai data.</p>
    <div class="cmpp-x"><button type="button" class="btn-o" data-cmpswap>Scambia A e B</button><button type="button" class="btn-o" data-cmpoff>Chiudi</button></div></div>`;
  box.querySelectorAll("[data-cnt]").forEach(el => {   // i numeri scorrono: dal valore di prima, o da zero al primo confronto
    const m = parse(el.textContent); if (!m) return;
    const prev = lastNum[el.dataset.cnt]; lastNum[el.dataset.cnt] = m.v;
    if (anim && !calm) countUp(el, prev ?? 0);
  });
}

// Regola dei prezzi tarata sulle variazioni reali: variazione = a + b·punti + c·crediti (per singola giornata).
// Dunkest muove i prezzi a passi di 0,1 e il minimo è 4 crediti.
const rule = () => (D.taratura && D.taratura.b > 0) ? D.taratura : null;
const round1 = v => Math.round(v * 10) / 10;
function plusFor(cr, pts) { const t = rule(); if (!t) return null; const raw = t.a + t.b * pts + t.c * cr; return Math.max(round1(raw), round1(4 - cr)); }
function ptsFor(cr, plus) { const t = rule(); return t ? (plus - 0.05 - t.a - t.c * cr) / t.b : null; }   // punti minimi per arrivare a "plus"
const TARGETS = [-0.3, -0.1, 0, 0.1, 0.3, 0.5, 1.0];

function thresholdsTable(cr) {
  return `<table class="thr-table"><thead><tr><th>Per ottenere</th><th>Servono almeno</th></tr></thead><tbody>${
    TARGETS.map(tg => `<tr><td class="${tg > 0 ? "up" : tg < 0 ? "down" : ""}">${tg > 0 ? "+" : ""}${num(tg)} cr</td><td><b>${num(Math.max(0, ptsFor(cr, tg)))}</b> punti</td></tr>`).join("")
  }</tbody></table>`;
}

let calcCr = 10, calcPts = 25;

// Ultime partite: barre dei punti Dunkest, linea dei punti attesi per la giornata
function spark(G, expv, ifPlays) {
  if (!G || !G.length) return "";
  const W = 320, H = 124, top = 18, base = 98, n = G.length, bw = (W - 8) / n, hid = "hatch" + (++jid);
  const defs = `<defs><pattern id="${hid}" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--c-base)" fill-opacity=".3"/><rect width="2.2" height="5" fill="var(--c-base)"/></pattern></defs>`;
  const mx = Math.max(...G.map(x => x.punti), expv || 0, 10), Y = v => base - Math.max(0, v) / mx * (base - top);
  const avg = G.reduce((s, x) => s + x.punti, 0) / n;
  const tipOf = x => `${dmy(x.data)} ${x.casa ? "vs" : "@"} ${x.avv}: ${num(x.punti)} punti in ${x.min} min`;
  const bars = G.map((x, k) => { const h = base - Y(x.punti), X = 4 + k * bw;
    const up = expv && x.punti >= expv;   // sotto gli attesi: barra a righe con il bordo, non solo un altro colore
    return `<rect class="b" data-k="${k}" style="--b:${k}" x="${(X + bw * .18).toFixed(1)}" y="${Y(x.punti).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="3" fill="${up ? "var(--c-hi)" : !expv ? "var(--c-base)" : `url(#${hid})`}"${expv && !up ? ` stroke="var(--c-base)" stroke-width="1.5"` : ""}><title>${esc(tipOf(x))}</title></rect>`; }).join("");
  // colonne trasparenti alte quanto il grafico: si tocca la colonna intera, non solo la barra

    ${expv ? `<p class="legend"><span><i class="hi"></i>sopra gli attesi</span><span><i class="hatch"></i>sotto</span><span><i class="dash"></i>attesi ${ifPlays ? "se gioca " : ""}${num(expv)}</span></p>` : ""}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Punti Dunkest nelle ultime ${n} partite, media ${num(avg)}">

    <span class="note" style="font-size:.8rem">${D.partite_stagione ? `${esc(D.partite_stagione)} (${dmy(G[0].data)}/${G[0].data.slice(2, 4)} – ${dmy(G.at(-1).data)}/${G.at(-1).data.slice(2, 4)}). ` : ""}Piene in arancio le partite sopra i punti attesi, a righe quelle sotto; @ = in trasferta. Tocca una barra per il dettaglio.</span></div>`;
}

// Ultime 5 partite in una striscia (Panoramica della scheda): punti, avversario e una barretta in scala che si riempie
// all'apertura; la tacca è il valore atteso. Solo se le partite ci sono davvero (in data.json/cerca.json: "partite").
function formStrip(G, expv) {
  if (!G || !G.length) return "";
  const L = G.slice(-5), mx = Math.max(...L.map(x => x.punti), expv || 0, 10), avg = L.reduce((s, x) => s + x.punti, 0) / L.length;
  const pct = v => (Math.max(0, v) / mx * 100).toFixed(1) + "%";
  const lab = D.partite_stagione ? ` <span style="text-transform:none;letter-spacing:0">· ${/passat/i.test(D.partite_stagione) ? "stagioni passate" : esc(D.partite_stagione)}</span>` : "";
  return `<div class="f5"><div class="f5-h"><span class="lab">Ultime ${L.length} partite${lab}</span><span class="muted num" style="font-size:var(--fs-s)">media <b data-cnt="f5m" style="color:var(--fg)">${num(avg)}</b></span></div>
    <ol class="f5-l">${L.map((x, k) => { const hi = expv && x.punti >= expv;
      return `<li class="${hi ? "hi" : ""}" data-tip="${esc(`${dmy(x.data)} ${x.casa ? "vs" : "@"} ${x.avv}: ${num(x.punti)} punti in ${x.min} min${expv ? (hi ? ", sopra" : ", sotto") + " gli attesi " + num(expv) : ""}`)}">
        <small>${dmy(x.data)}</small><span class="f5-b" aria-hidden="true"><i style="--h:${pct(x.punti)};--b:${k}"></i>${expv ? `<em style="--e:${pct(expv)}"></em>` : ""}</span><b>${num(x.punti, 0)}</b><small>${x.casa ? "" : "@"}${esc(x.avv)}</small></li>`; }).join("")}</ol>
    ${expv ? `<p class="legend"><span><i class="hi"></i>sopra gli attesi</span><span><i class="hatch"></i>sotto</span><span><i class="dash"></i>tacca: attesi ${num(expv)}</span></p>` : ""}</div>`;
}

function formBlock(f) {
  if (!f || !(f.media > 0)) return `<p class="note">Forma: dati disponibili dopo le prime partite della stagione.</p>`;
  return `<div class="facts"><div><b>${num(f.media)}</b><span>media stagione</span></div>
    <div><b>${num(f.media_5)}</b><span>ultime 5 ${f.stato && f.stato !== "stabile" ? (f.stato === "in forma" ? "▲" : "▼") : ""}</span></div>
    <div><b>${sign(f.plus_stagione ?? 0)}</b><span>plus stagione</span></div></div>`;
}
